const VERWERS=[tekenGebou,tekenBoom,tekenMens,tekenHoender,tekenDwaler,tekenPa];
function verwerId(fn){VERWERS.push(fn);return VERWERS.length-1;}
function render(){
  if(!VW||!VH)return;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#131a10';ctx.fillRect(0,0,VW,VH);
  ctx.save();
  ctx.translate(VW/2,VH/2);ctx.scale(KAM.z,KAM.z);ctx.translate(-KAM.x,-KAM.y);
  ctx.drawImage(bg,0,0,bg.width,bg.height,0,0,WW,WH);
  // vragte op die grond
  for(const v of VRAGTE){
    if(!vis(v.x,v.y,30))continue;
    const kl=v.soort==='hout'?'#8a6f3f':v.soort==='klip'?'#9aa0a2':'#7fc95e';
    ctx.fillStyle='rgba(10,14,7,.3)';ctx.beginPath();ctx.ellipse(v.x,v.y+3,10,3.4,0,0,TAU);ctx.fill();
    ctx.fillStyle=kl;ctx.fillRect(v.x-9,v.y-4,18,8);
    ctx.strokeStyle='#14180e';ctx.lineWidth=1.8;ctx.strokeRect(v.x-9,v.y-4,18,8);
  }
  tekenHoop('hout');tekenHoop('klip');if(!hetSpens())tekenHoop('kos');
  tekenSpanMerke();                    // grondmerke, onder die y-gesorteerde lywe
  // die spook
  if(PLAAS&&GT[PLAAS].muur)muurSpook();   // 'n muur wys as LYN, nie as een blok nie
  else if(PLAAS){
    const G2=GT[PLAAS],ok=kanBou(PLAAS,SPOOK.x,SPOOK.y)&&kanBekostig(PLAAS);
    ctx.fillStyle=ok?'rgba(127,201,94,.25)':'rgba(192,80,56,.3)';
    ctx.fillRect(SPOOK.x-G2.w/2,SPOOK.y-G2.h/2,G2.w,G2.h);
    ctx.strokeStyle=ok?'#7fc95e':'#c05038';ctx.lineWidth=3;ctx.setLineDash([8,6]);
    ctx.strokeRect(SPOOK.x-G2.w/2,SPOOK.y-G2.h/2,G2.w,G2.h);ctx.setLineDash([]);
    ctx.fillStyle=ok?'#7fc95e':'#c05038';ctx.font='22px VT323,monospace';ctx.textAlign='center';
    ctx.fillText(G2.ikoon,SPOOK.x,SPOOK.y+8);
  }
  // y-gesorteer
  const dinge=[];
  for(const g of GEB)if(vis(g.x,g.y,140))dinge.push([g.y+GT[g.tipe].h/2,0,g]);
  for(const b of BOME)if(b.toestand!=='weg'&&vis(b.x,b.y,60))dinge.push([b.y,1,b]);
  for(const m of MENSE)if(vis(m.x,m.y,50))dinge.push([m.y,2,m]);
  for(const h of HOENDERS)if(vis(h.x,h.y,20))dinge.push([h.y,3,h]);
  for(const d of DWALERS)if(vis(d.x,d.y,40))dinge.push([d.y,4,d]);
  verfLys(dinge);   // eenhede + die kaserne se oorlaag, y-gesorteer saam met die res
  for(const n of NESTE)if(vis(n.x,n.y,220))dinge.push([n.y+16,T_NES,n]);
  for(const b of BROERS)if(b.toestand!=='gedra'&&vis(b.x,b.y,80))dinge.push([b.y,T_BROER,b]);
  if(!broerAktief('pa'))dinge.push([PA.y,5,PA]);   // twee Pa's lees vreemd
  dinge.sort((a,b)=>a[0]-b[0]);
  for(const [,t,d] of dinge)VERWERS[t](d);   // sien VERWERS hieronder
  // klok-swaai
  if(klokSwaai>0){
    ctx.save();ctx.translate(KLOKPAAL.x+7,KLOKPAAL.y+6);
    ctx.rotate(Math.sin(klokSwaai*12)*.5*klokSwaai);
    ctx.fillStyle='#e0b64f';
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-7,16);ctx.lineTo(7,16);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#14180e';ctx.lineWidth=2;ctx.stroke();ctx.restore();
  }else{
    ctx.fillStyle='#e0b64f';
    ctx.beginPath();ctx.moveTo(KLOKPAAL.x+7,KLOKPAAL.y+6);ctx.lineTo(KLOKPAAL.x,KLOKPAAL.y+22);
    ctx.lineTo(KLOKPAAL.x+14,KLOKPAAL.y+22);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#14180e';ctx.lineWidth=2;ctx.stroke();
  }
  // goud onderweg — die telling skuif eers wanneer een land
  for(const c of MUNTVLUG){
    const f=c.t/c.dur;
    const x=c.x0+(c.x1-c.x0)*f, y=c.y0+(c.y1-c.y0)*f-Math.sin(f*Math.PI)*22;
    if(!vis(x,y,30))continue;
    const sp=Math.max(.18,Math.abs(Math.cos(f*13)));      // hy tol in die lug
    ctx.fillStyle='#e0b64f';ctx.fillRect(x-3*sp,y-3,6*sp,6);
    ctx.fillStyle='#fff0bd';ctx.fillRect(x-3*sp,y-3,Math.max(1,2*sp),2);
    ctx.strokeStyle='#14180e';ctx.lineWidth=1.2;ctx.strokeRect(x-3*sp,y-3,Math.max(1.6,6*sp),6);
  }
  for(const r of ROOK){
    const f=r.t/r.life;
    ctx.fillStyle='rgba(154,160,127,'+(.4*(1-f))+')';
    ctx.beginPath();ctx.arc(r.x,r.y,3+f*7,0,TAU);ctx.fill();
  }
  for(const p of SPANNE){
    ctx.globalAlpha=1-p.t/p.life;ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y,p.r,p.r);ctx.globalAlpha=1;
  }
  for(const k of KRAAIE){
    const kx=WERF.x+Math.cos(k.a)*k.r*1.3, ky=WERF.y-160+Math.sin(k.a)*k.r*.5;
    const klap=Math.sin(k.a*9);
    ctx.strokeStyle='rgba(20,24,14,.8)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(kx-5,ky-klap*3);ctx.quadraticCurveTo(kx,ky+2,kx+5,ky-klap*3);ctx.stroke();
  }
  ctx.restore();
  // NAG bo-oor, plus warm ligte by braai/torings
  const na=nagAlpha();
  if(na>.01){
    ctx.fillStyle='rgba(12,18,34,'+na+')';ctx.fillRect(0,0,VW,VH);
    ctx.save();
    ctx.translate(VW/2,VH/2);ctx.scale(KAM.z,KAM.z);ctx.translate(-KAM.x,-KAM.y);
    ctx.globalCompositeOperation='lighter';
    const ligte=[];
    const br=braaiPlek();
    if(br&&BRAAI_AAN)ligte.push([br.x,br.y,150,'rgba(232,160,47,']);
    for(const g of GEB)if(g.klaar&&GT[g.tipe].lig)ligte.push([g.x,g.y,120,'rgba(224,182,79,']);
    for(const g of GEB)if(g.klaar&&GT[g.tipe].bed)ligte.push([g.x,g.y,60,'rgba(224,182,79,']);
    for(const [lx,ly,lr,c] of ligte){
      const gr=ctx.createRadialGradient(lx,ly,4,lx,ly,lr);
      gr.addColorStop(0,c+(na*.55)+')');gr.addColorStop(1,c+'0)');
      ctx.fillStyle=gr;ctx.beginPath();ctx.arc(lx,ly,lr,0,TAU);ctx.fill();
    }
    ctx.globalCompositeOperation='source-over';
    ctx.restore();
  }
  nesWysers();          // die neste wat NIE op die skerm is nie
  // toast
  if(toastT>0){
    ctx.font='20px VT323,monospace';ctx.textAlign='center';
    const w=ctx.measureText(toastMsg).width+24;
    ctx.globalAlpha=Math.min(1,toastT);
    ctx.fillStyle='rgba(10,14,7,.9)';ctx.fillRect(VW/2-w/2,VH-160,w,28);
    ctx.strokeStyle='#e0b64f';ctx.lineWidth=2;ctx.strokeRect(VW/2-w/2,VH-160,w,28);
    ctx.fillStyle='#e0b64f';ctx.fillText(toastMsg,VW/2,VH-140);
    ctx.globalAlpha=1;
  }
}

/* ============================================================================
   DIE KASERNE EN DIE KRYGSMAG — die AoE-kant van 'n Stronghold-plaas.

   PLASING: plak hierdie hele blok as EEN stuk net BO die reël
   `/* ============================== LUS ============================== *​/`
   (d.w.s. ná vlakMerk/tekenHoop/render, voor function raam). Dit MOET op
   topvlak loop voor die BEGIN-afdeling, want dit skryf GT.kaserne,
   VLAKKE.kaserne en GT_ORDE in — dieselfde katalogus wat bouBalk() by die
   begin lees.

   DIE PRYS IS 'N MENS. Munte en tyd is die maklike helfte; die harde helfte is
   dat 'n boer opstaan, sy taak los, na die kaserne stap en dáár uit MENSE
   verdwyn. Daarom word die rekruut eers gewerf as sy bevel VOOR in die tou is —
   'n ry van vier bevele mag nie jou hele werksmag in een oomblik afvee nie.
   ============================================================================ */

/* --- die katalogus-inskrywing. 14 vragte: die duurste ding op die werf, en dit
   hoort so — dis die gebou wat jou boere in soldate verander. --- */
GT.kaserne={naam:'Kaserne', ikoon:'⚔️', koste:{hout:9,klip:5}, w:96, h:74,
            werk:'dril', plekke:1, kaserne:true,
            help:'Een drilmeester lei soldate op. Elke soldaat is ’n boer minder.'};
/* Kooie, nie beddens nie: soldate slaap in die kaserne en tel dus NIE in die
   oorbevolking-ry nie. Die opgradering koop plek + ontsluit swaarder eenhede. */
VLAKKE.kaserne=[{kooie:3},{kooie:5,koste:{hout:6,klip:5}},{kooie:8,koste:{hout:9,klip:8}}];
/* voor die palissade in die winkel: die palissade is die laaste, goedkoopste ry */
if(GT_ORDE.indexOf('kaserne')<0)GT_ORDE.splice(GT_ORDE.indexOf('palissade'),0,'kaserne');

/* --- MUNTE. Die brug-geldeenheid: goud kom uit die zombie-lopies, nie uit die
   plaas nie (geen AFK-inkomste). Tot die lopie-brug land, is Pa se koffieblik in
   die ruïne die enigste bron: 40 munte, een keer, nooit weer nie. --- */
/* GOUD: geen saad, geen eie deur. goudBy()/betaalGoud() en die HUD-blokkie behoort aan die
   belasting-stelsel (S.goud = WERF-geld). Munte uit die lopies koop net die broers. */

/* --- DIE EENHEDE. Vier statistieke wat saak maak: hoeveel hy vat (hp), hoeveel
   hy uitdeel (skade/tempo), hoe ver (reik) en hoe vinnig (spd).
   YKING teen die dwaler (18 hp, 4 skade/s in kontak):
     Wagter  6 dps → dood in 3.0s, oorleef 8.5s kontak → wen 1v1 met marge.
     Skut    3.9 dps op 190px → hy tref 4x voordat 'n dwaler (16px/s) hom raak.
     Saagman 12.3 dps → dood in 1.5s, oorleef 11.5s → hy is die nes-breker.
   Die goud/tyd-lyn is bewustelik steil: 12/24s, 22/34s, 38/50s. --- */
const EENHEIDT={
  wagter: {naam:'Wagter',  ikoon:'🛡️', goud:12, oefen:24, hp:34, skade:6,  tempo:1.0, reik:24,  spd:48, vlak:1,
           wapen:'graaf',       help:'Graaf in die hand. Taai, stadig, goedkoop.'},
  skut:   {naam:'Skut',    ikoon:'🔫', goud:22, oefen:34, hp:20, skade:7,  tempo:1.8, reik:190, spd:52, vlak:2,
           wapen:'.22',         help:'Skiet ver met die .22. Hy breek maklik.'},
  saagman:{naam:'Saagman', ikoon:'🪚', goud:38, oefen:50, hp:46, skade:16, tempo:1.3, reik:28,  spd:44, vlak:3,
           wapen:'kettingsaag', help:'Kettingsaag. Duur, luidrugtig, dodelik.'},
};
const EENHEID_ORDE=['wagter','skut','saagman'];
const EENHEDE=[];
const EET_SOLDAAT=1.5;      // 'n soldaat eet meer as 'n boer en oes niks
const KRYGS_MIN=3;          // onder drie boere mag jy niemand meer wegvat nie
const KAS_TOU_MAKS=4;
const WAAK=300;             // hoe ver van sy pos af 'n eenheid sal uitstap
const DWALER_HP=18, DWALER_DPS=4;
let rouTel=0, rouDag=0, eenhStoorT=0;

/* --- klein lesings oor die krygsmag --- */
function kasernes(){const a=[];for(const g of GEB)if(g.tipe==='kaserne'&&g.klaar)a.push(g);return a;}
function kasKooie(g){const d=vDat('kaserne',gVlak(g));return (d&&d.kooie!==undefined)?d.kooie:3;}
function kooieTotaal(){let n=0;for(const g of kasernes())n+=kasKooie(g);return n;}
function besteKaserne(){let b=null;for(const g of kasernes())if(!b||gVlak(g)>gVlak(b))b=g;return b;}
function kasVlak(){const b=besteKaserne();return b?gVlak(b):0;}
function touLengte(){let n=0;for(const g of kasernes())n+=(g.tou?g.tou.length:0);return n;}
/* MONDE, nie MENSE nie. Sonder hierdie funksie sou 'n soldaat se aanmelding die
   spens se verbruik LAAT DAAL — soldate maak het jou dan ryker aan kos. Dit sou
   die hele yking (een tuinier voed vier monde) op sy kop keer. */
MONDBRONNE.push(()=>EENHEDE.length*EET_SOLDAAT);   // deur die register — nie 'n eie monde() nie
function rallyPunt(){
  if(S.rally)return S.rally;
  const g=besteKaserne();
  return g?{x:g.x,y:g.y+GT.kaserne.h/2+42}:{x:WERF.x,y:WERF.y+90};
}
function stoorEenhede(){
  S.eenh=EENHEDE.map(e=>[e.tipe,Math.round(e.x),Math.round(e.y),Math.round(e.hp),e.naam]);
  persistSoon();
}

/* --- 'n mens wat weggevat word, moet ALLES los waarop hy 'n eis het. Doen ons
   dit nie, bly site.opPad vir ewig opgetel en die bousite wag vir hout wat nooit
   kom nie (dieselfde starvation wat die vlug-kode moes regmaak). --- */
function losAlleEise(m){
  if(m.dra)losVrag(m);
  const t=m.taak;
  if(t){
    if(t.tipe==='vat'&&t.site){
      t.site.opPad--;
      if(t.soort==='hout')t.site.opPadH--;else t.site.opPadK--;
    }
    if(t.tipe==='bou'&&t.site&&t.site.bouer===m)t.site.bouer=null;
    if(t.tipe==='kap'&&t.boom)t.boom.geëis=Math.max(0,t.boom.geëis-1);  // die merk bly: die speler het hom gemerk
  }
  m.taak=null;
  if(m.werkplek){
    const i=m.werkplek.werkers.indexOf(m);
    if(i>=0)m.werkplek.werkers.splice(i,1);
    m.werkplek=null;
  }
}
function kiesRekruut(g){
  let beste=null,bd=1e12;
  for(const m of MENSE){
    if(m.werkplek&&m.werkplek.tipe==='kaserne')continue;    // die drilmeester werf nie homself nie
    if(m.taak&&m.taak.tipe==='aanmeld')continue;
    const d=dist2(m.x,m.y,g.x,g.y);
    if(d<bd){bd=d;beste=m;}
  }
  return beste;
}

/* --- 'N BEVEL PLAAS. Munte word HIER afgetrek (anders staan 'n gratis ry van
   vier), die lyf word eers gevat as die bevel voor in die tou kom. --- */
function werfEenheid(tipe){
  const E=EENHEIDT[tipe], g=besteKaserne();
  if(!g){plToast('Bou eers ’n kaserne.');return false;}
  if(gVlak(g)<E.vlak){plToast(E.naam+' vra ’n kaserne op vlak '+E.vlak+'.');klank(150,.16,.1);return false;}
  g.tou=g.tou||[];
  if(g.tou.length>=KAS_TOU_MAKS){plToast('Die oefentou is vol.');klank(150,.16,.1);return false;}
  if(EENHEDE.length+touLengte()>=kooieTotaal()){
    plToast('Geen kooi oop nie — gradeer die kaserne op.');klank(150,.16,.1);return false;}
  if(MENSE.length-1<KRYGS_MIN){
    plToast('Iemand moet die plaas aan die gang hou.');klank(150,.16,.1);return false;}
  /* VLOEI-HEK: 'n soldaat eet 1.5 monde en oes niks. Sonder hierdie toets kan 'n speler
     sy hele werksmag werf en die plaas verhonger sonder 'n pad terug. */
  if(kosVloei()<(monde()+EET_SOLDAAT)*4+6){
    plToast('Ons kan hom nie voed nie — bou eers ’n tuin.');klank(150,.16,.1);return false;}
  if((S.goud||0)<E.goud){
    plToast('Te min goud. Hef belasting by die skathuis.');klank(150,.16,.1);return false;}
  goudBy(-E.goud);
  g.tou.push({tipe,t:0,duur:E.oefen,staat:'werf',mens:null,pieper:0});
  plToast(E.naam+' is op die oefenlys.');klank(360,.1,.12);
  bouBalk();persistSoon();
  return true;
}
/* Kanselleer die LAASTE bevel. Is dit een wat reeds oefen, kom die man terug
   werf toe — 'n bevel wat jou lyf VIR ALTYD sluk sou 'n lokval wees, nie 'n
   besluit nie. */
function kanselleerLaaste(){
  const g=besteKaserne();
  if(!g||!g.tou||!g.tou.length){plToast('Niks om te kanselleer nie.');return;}
  const o=g.tou.pop();
  goudBy(EENHEIDT[o.tipe].goud);
  if(o.mens){
    if(o.staat==='oefen'){
      const m=o.mens;
      m.x=g.x+rand(-16,16); m.y=g.y+GT.kaserne.h/2+rand(10,20);
      m.taak=null;m.dra=null;m.werkplek=null;
      MENSE.push(m);bemanGeboue();
      plToast(m.naam+' is terug op die land.');
    }else if(o.mens.taak&&o.mens.taak.orde===o)o.mens.taak=null;
  }
  klank(200,.14,.1);stoorEenhede();bouBalk();persistSoon();
}
/* ONTBIND — die deur terug. Sonder dit is elke werwing eenrigting en die kenmerk 'n lokval. */
function ontbindLaaste(){
  const e=EENHEDE.pop(); if(!e){plToast('Geen soldate om te ontbind nie.');return;}
  const m=maakMens(e.x,e.y); m.naam=e.naam; MENSE.push(m);
  hervormEenhede(); bemanGeboue(); stoorEenhede();
  plToast(e.naam+' is terug op die land.'); klank(260,.12,.1); bouBalk(); persistSoon();
}
/* Die oomblik van die prys: hy stap by die deur in en is uit die bevolking uit. */
function meldAan(m,g,o){
  const i=MENSE.indexOf(m); if(i>=0)MENSE.splice(i,1);
  m.taak=null;m.dra=null;
  o.mens=m;o.staat='oefen';o.t=0;
  bemanGeboue();                       // sy ou werkplek moet iemand anders kry
  plToast(m.naam+' het aangemeld — een paar hande minder op die land.');
  paSê('Sterkte, '+m.naam.split(' ')[0]+'.');
  klank(300,.16,.13);spanne(g.x,g.y+GT.kaserne.h/2,7,'#c05038');
  bouBalk();persistSoon();
}

function nuweEenheid(tipe,x,y,mens){
  const E=EENHEIDT[tipe];
  return {tipe,naam:mens?mens.naam:volgendeNaam(),x,y,
    hp:E.hp,maksHp:E.hp,skade:E.skade,tempo:E.tempo,reik:E.reik,spd:E.spd,
    klr:mens?mens.klr:KLEURE[(R()*KLEURE.length)|0],
    hare:mens?mens.hare:HARE[(R()*HARE.length)|0],
    rig:1,tred:R()*TAU,slaan:0,herlaai:R()*.6,doel:null,
    flits:0,skoot:0,skootX:0,skootY:0,pos:{x:0,y:0}};
}
/* Die gelid word na ELKE verandering herbereken sodat 'n dooie nie 'n gat in die
   ry los nie — 'n ry met 'n gat lees soos 'n fout, nie soos 'n verlies nie. */
function hervormEenhede(){
  EENHEDE.forEach((e,i)=>{e.pos.x=((i%4)-1.5)*26; e.pos.y=Math.floor(i/4)*24;});
}
function eenheidGebore(tipe,g,mens){
  const e=nuweEenheid(tipe,g.x+rand(-14,14),g.y+GT.kaserne.h/2+rand(8,18),mens);
  EENHEDE.push(e);hervormEenhede();
  plToast(EENHEIDT[tipe].naam+' '+e.naam+' is opgelei.');
  paSê('Daar staan ’n man vir die werf.');
  klank(700,.2,.14);spanne(e.x,e.y-14,10,'#e8c96a');
  stoorEenhede();bouBalk();
  return e;
}
function eenheidSterf(e){
  const i=EENHEDE.indexOf(e); if(i>=0)EENHEDE.splice(i,1);
  hervormEenhede();
  rouTel++;                            // die dryf-model straf dit môre, nie nou nie
  plToast(e.naam+' het geval.');paSê('Ons dra hom werf toe.');
  spanne(e.x,e.y-12,14,'#c05038');klank(110,.35,.18);
  stoorEenhede();bouBalk();
}

/* --- DIE KASERNE SE HARTSLAG: een bevel op 'n slag, en net terwyl die
   drilmeester op die werf staan. --- */
function kasTik(g,dt){
  if(!g.klaar){g.stil=null;return;}
  const tou=g.tou;
  if(!tou||!tou.length){g.stil=null;return;}
  const o=tou[0], E=EENHEIDT[o.tipe];
  if(o.staat==='werf'){
    if(o.mens&&!MENSE.includes(o.mens))o.mens=null;         // hy het geloop of geval
    if(o.mens&&(!o.mens.taak||o.mens.taak.tipe!=='aanmeld'))o.mens.taak={tipe:'aanmeld',g,orde:o};
    if(!o.mens){
      const m=kiesRekruut(g);
      if(!m){g.stil='Niemand kan aanmeld nie';return;}
      losAlleEise(m);bemanGeboue();
      m.taak={tipe:'aanmeld',g,orde:o};
      o.mens=m;
    }
    g.stil=null;
    return;                                                 // die klok loop eers as hy binne is
  }
  const dril=g.werkers.find(w=>w&&MENSE.includes(w)&&dist2(w.x,w.y,g.x,g.y)<190*190);
  if(!dril){g.stil='Geen drilmeester nie';return;}
  g.stil=null;
  o.t+=dt;
  o.pieper-=dt;
  if(o.pieper<=0){o.pieper=3;klank(240+Math.round(o.t/o.duur*180),.05,.06);}
  if(o.t>=o.duur){
    tou.shift();
    eenheidGebore(o.tipe,g,o.mens);
  }
}

/* --- EENHEID-GEDRAG. Dit is die NAAT waar 'n latere bevel-/nes-stelsel inhaak:
   alles wat 'n eenheid doen, loop deur bevelPunt() en eenheidVeg(). Vervang dié
   twee en die res van hierdie lêer bly staan. --- */
function bevelPunt(e){
  const rp=rallyPunt();
  return {x:rp.x+e.pos.x, y:rp.y+e.pos.y};
}
function eenheidVeg(e,dt){
  const rp=rallyPunt();
  let doel=null,bd=WAAK*WAAK;
  for(const d of DWALERS){
    if(d.dood||d.weg)continue;
    if(dist2(d.x,d.y,rp.x,rp.y)>WAAK*WAAK)continue;         // hy verlaat nie sy pos vir 'n dwaler in die veld nie
    const q=dist2(e.x,e.y,d.x,d.y);
    if(q<bd){bd=q;doel=d;}
  }
  e.doel=doel;
  if(!doel)return false;
  if(bd>e.reik*e.reik){stapNa(e,doel.x,doel.y,dt);return true;}
  e.rig=doel.x<e.x?-1:1;
  e.tred+=dt*1.1;
  if(e.herlaai>0)return true;
  e.herlaai=e.tempo;
  if(doel.hp===undefined)doel.hp=DWALER_HP;                 // dwalers kry hul hp eers hier — geen anker in maakDwaler
  doel.hp-=e.skade;
  e.slaan=1;
  if(e.reik>60){e.skoot=.12;e.skootX=doel.x;e.skootY=doel.y-12;klank(920,.05,.09);}
  else klank(230+R()*50,.06,.1);
  spanne(doel.x+rand(-6,6),doel.y-12,3,'#c05038');
  if(doel.hp<=0){
    doel.dood=true;
    spanne(doel.x,doel.y-10,13,'#6b8f3a');klank(120,.26,.16);
    S.gedood=(S.gedood||0)+1;persistSoon();
  }
  return true;
}
function eenheidTik(e,dt){
  if(e.flits>0)e.flits-=dt;
  if(e.skoot>0)e.skoot-=dt;
  if(e.herlaai>0)e.herlaai-=dt;
  if(e.slaan>0)e.slaan-=dt*2.2;
  const veg=eenheidVeg(e,dt);
  if(!veg){
    const p=bevelPunt(e);
    if(!stapNa(e,p.x,p.y,dt))e.rig=e.rig;                   // stapNa doen die tred en die omleiding
  }
  /* Kontak sny. Sonder skade op die soldaat is 'n eenheid 'n gratis muur en die
     hele koste-vraag verdamp. */
  for(const d of DWALERS){
    if(d.dood)continue;
    if(dist2(d.x,d.y,e.x,e.y)<26*26){e.hp-=DWALER_DPS*dt;e.flits=.14;}
  }
  if(e.hp<=0)eenheidSterf(e);
}
/* Een enkele oproep vir update(): kasernes, eenhede, HUD en die stoor-klok. */
function krygsmagTik(dt){
  if(S.dag!==rouDag){rouDag=S.dag;rouTel=0;}                // dagDryf het die rou reeds ingereken
  for(const g of GEB)if(g.tipe==='kaserne')kasTik(g,dt);
  for(let i=EENHEDE.length-1;i>=0;i--)eenheidTik(EENHEDE[i],dt);
  eenhStoorT-=dt;
  if(eenhStoorT<=0){eenhStoorT=5;if(EENHEDE.length)stoorEenhede();}
}
/* Die twee humeur-rye. BEGRENS: 'n staande mag mag nooit 'n geluk-enjin word nie,
   en 'n leër wat sy boere oortref, moet seer. */
function krygsGeluk(rye){
  const sold=EENHEDE.length;
  if(sold){
    const oor=sold-MENSE.length;
    if(oor>0)rye.push(['Meer soldate as boere',-Math.min(6,2*oor),'gebeurtenis']);
    else if(sold>=2)rye.push(['’n Wag op die werf',+1,'veiligheid']);
  }
  if(rouTel)rye.push([rouTel===1?'’n Soldaat het geval':rouTel+' soldate het geval',
                      -Math.min(9,3*rouTel),'gebeurtenis']);
}

GLBRONNE.push(rye=>krygsGeluk(rye));

/* ============================== VERF ============================== */
const T_KRYG=verwerId(krygsVerf);   // eie verwer-nommer uit die register — nooit 'n hardgekodeerde 6
function verfLys(dinge){
  for(const e of EENHEDE)if(vis(e.x,e.y,60))dinge.push([e.y,T_KRYG,e]);
  for(const g of GEB)if(g.tipe==='kaserne'&&vis(g.x,g.y,180))
    dinge.push([g.y+GT.kaserne.h/2+1,T_KRYG,g]);                 // oorlaag NET ná die gebou self
}
function krygsVerf(d){
  if(d.tipe==='kaserne')tekenKaserneOor(d);else tekenEenheid(d);
}
function tekenKaserneOor(g){
  const r=gebRegs(g);
  if(g.klaar){
    // seil-strook + vlagpaal: sonder dit lees die kaserne op lae zoem soos 'n huis
    ctx.fillStyle='#4e6b34';ctx.fillRect(r.x+2,r.y+r.h-14,r.w-4,5);
    ctx.strokeStyle='#14180e';ctx.lineWidth=1.6;ctx.strokeRect(r.x+2,r.y+r.h-14,r.w-4,5);
    ctx.fillStyle='#4a3a22';ctx.fillRect(r.x+r.w-9,r.y-24,3,26);
    ctx.fillStyle='#c05038';
    ctx.beginPath();ctx.moveTo(r.x+r.w-6,r.y-24);ctx.lineTo(r.x+r.w+11,r.y-19);
    ctx.lineTo(r.x+r.w-6,r.y-14);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#14180e';ctx.lineWidth=1.4;ctx.stroke();
    // oefenpop op die werf
    const px=r.x-14, py=r.y+r.h+12;
    ctx.fillStyle='#5d4a2c';ctx.fillRect(px-2,py-16,4,16);
    ctx.fillStyle='#8a7658';ctx.fillRect(px-7,py-24,14,10);
    ctx.strokeStyle='#14180e';ctx.lineWidth=1.5;ctx.strokeRect(px-7,py-24,14,10);
  }
  const tou=g.tou||[];
  if(g.klaar&&tou.length){
    const o=tou[0], w=r.w;
    const p=o.staat==='oefen'?clamp(o.t/o.duur,0,1):0;
    ctx.fillStyle='rgba(10,14,7,.8)';ctx.fillRect(r.x,r.y-24,w,9);
    ctx.fillStyle=o.staat==='oefen'?'#c05038':'#9aa07f';
    ctx.fillRect(r.x+1,r.y-23,(w-2)*p,7);
    ctx.font='13px VT323,monospace';ctx.textAlign='left';
    ctx.fillStyle='#ece5cc';
    ctx.fillText(EENHEIDT[o.tipe].ikoon+(o.staat==='oefen'?'':' wag'),r.x+2,r.y-27);
    for(let i=1;i<tou.length;i++){                          // die res van die tou as pitte
      ctx.fillStyle='#9aa07f';ctx.fillRect(r.x+w-i*8,r.y-33,6,5);
    }
  }
  if(g.klaar&&g.stil){
    ctx.font='14px VT323,monospace';ctx.textAlign='center';
    ctx.fillStyle='#e0b64f';ctx.fillText('⚠ '+g.stil,g.x,r.y-36);
  }
  if(GEKIES===g&&g.klaar){                                  // wys waarheen die mag marsjeer
    const rp=rallyPunt();
    ctx.strokeStyle='rgba(192,80,56,.7)';ctx.lineWidth=2;ctx.setLineDash([6,6]);
    ctx.beginPath();ctx.moveTo(g.x,g.y+GT.kaserne.h/2);ctx.lineTo(rp.x,rp.y);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#c05038';ctx.fillRect(rp.x-1,rp.y-20,3,20);
    ctx.beginPath();ctx.moveTo(rp.x+2,rp.y-20);ctx.lineTo(rp.x+15,rp.y-16);
    ctx.lineTo(rp.x+2,rp.y-12);ctx.closePath();ctx.fill();
  }
}
function tekenEenheid(e){
  const x=e.x,y=e.y, wip=Math.sin(e.tred);
  ctx.fillStyle='rgba(10,14,7,.35)';
  ctx.beginPath();ctx.ellipse(x,y+2,8,3,0,0,TAU);ctx.fill();
  ctx.save();ctx.translate(x,y+wip*.4);
  if(e.rig<0)ctx.scale(-1,1);
  ctx.fillStyle='#2a1f12';ctx.fillRect(-4+wip*2.5,-6,3.5,7);ctx.fillRect(1-wip*2.5,-6,3.5,7);
  ctx.fillStyle=e.flits>0?'#c05038':e.klr;ctx.fillRect(-5,-19,10,13);
  ctx.fillStyle='rgba(226,240,180,.32)';ctx.fillRect(-5,-19,2.5,13);
  ctx.fillStyle='#4e5a34';ctx.fillRect(-5,-19,10,3);            // baadjie-band: soldaat, nie boer nie
  ctx.fillStyle='#dfa987';ctx.fillRect(-4,-27,8,8);
  ctx.fillStyle=e.hare;ctx.fillRect(-4,-29,8,3);
  if(e.tipe==='wagter'){                                        // graaf oor die skouer
    const sw=Math.sin(clamp(e.slaan,0,1)*Math.PI)*1.3;
    ctx.save();ctx.translate(4,-16);ctx.rotate(-.9+sw);
    ctx.fillStyle='#5d4a2c';ctx.fillRect(0,-1.6,14,3.2);
    ctx.fillStyle='#9aa0a2';ctx.fillRect(13,-4.5,6,9);
    ctx.strokeStyle='#14180e';ctx.lineWidth=1.4;ctx.strokeRect(13,-4.5,6,9);
    ctx.restore();
  }else if(e.tipe==='skut'){                                    // .22 teen die skouer
    ctx.save();ctx.translate(3,-15);ctx.rotate(-.15);
    ctx.fillStyle='#3a2a18';ctx.fillRect(-2,-1.4,7,3);
    ctx.fillStyle='#6b6a5a';ctx.fillRect(5,-1,15,2);
    ctx.restore();
  }else{                                                        // kettingsaag
    const br=Math.sin(performance.now()/40)*1.2;
    ctx.save();ctx.translate(4,-14+br*.3);ctx.rotate(-.35+Math.sin(clamp(e.slaan,0,1)*Math.PI)*1.1);
    ctx.fillStyle='#c05038';ctx.fillRect(-1,-4,8,8);
    ctx.fillStyle='#9aa0a2';ctx.fillRect(7,-2,16,4);
    ctx.strokeStyle='#14180e';ctx.lineWidth=1.4;ctx.strokeRect(7,-2,16,4);
    ctx.restore();
  }
  ctx.strokeStyle='rgba(20,24,14,.75)';ctx.lineWidth=2;
  ctx.strokeRect(-5,-19,10,13);ctx.strokeRect(-4,-27,8,8);
  ctx.restore();
  if(e.skoot>0){                                                // die .22 se lyn
    ctx.strokeStyle='rgba(255,236,180,.85)';ctx.lineWidth=1.6;
    ctx.beginPath();ctx.moveTo(x+(e.rig>0?9:-9),y-16);ctx.lineTo(e.skootX,e.skootY);ctx.stroke();
  }
  if(e.hp<e.maksHp){
    const w=18;
    ctx.fillStyle='rgba(10,14,7,.8)';ctx.fillRect(x-w/2,y-38,w,4);
    ctx.fillStyle=e.hp/e.maksHp>.4?'#7fc95e':'#c05038';
    ctx.fillRect(x-w/2+1,y-37,(w-2)*clamp(e.hp/e.maksHp,0,1),2);
  }
  if(KAM.z>1.5){
    ctx.font='13px VT323, monospace';ctx.textAlign='center';
    ctx.fillStyle='rgba(236,229,204,.75)';ctx.fillText(e.naam,x,y-42);
  }
}

/* ============================== BALK-RY ==============================
   Wanneer 'n klaar kaserne gekies is, WORD die onderste ry die krygsry — dieselfde
   modale patroon as die bou-ry. So steel die nuwe knoppies nooit plek by die
   rantsoen-hefboom nie; los die kaserne en die gewone ry is terug. */
function kasBalkRy(r){
  const g=GEKIES, vlak=gVlak(g);
  for(const t of EENHEID_ORDE){
    const E=EENHEIDT[t];
    const b=document.createElement('button');
    const oop=vlak>=E.vlak;
    const kan=oop&&(S.goud||0)>=E.goud&&(EENHEDE.length+touLengte())<kooieTotaal()
              &&MENSE.length-1>=KRYGS_MIN&&(g.tou||[]).length<KAS_TOU_MAKS;
    b.className='kn'+(kan?'':' kan_nie');
    b.innerHTML=E.ikoon+' '+E.naam+'<small>'+
      (oop?E.goud+'🪙 · '+E.oefen+'s · 1 mens':'kaserne vlak '+E.vlak)+'</small>';
    b.onclick=()=>{werfEenheid(t);};
    r.appendChild(b);
  }
  const vp=document.createElement('button');
  vp.className='kn'+(MODUS==='rally'?' aan':'');
  vp.innerHTML='⚑ Versamel<small>waar hulle staan</small>';
  vp.onclick=()=>{MODUS=MODUS==='rally'?null:'rally';
    wysPrompt(MODUS==='rally'?'Tik waar die soldate moet staan.':null);bouBalk();};
  r.appendChild(vp);
  if((g.tou||[]).length){
    const kk=document.createElement('button');kk.className='kn rooi';
    kk.innerHTML='✗ Kanselleer<small>goud terug</small>';
    kk.onclick=()=>kanselleerLaaste();
    r.appendChild(kk);
  }
  if(EENHEDE.length){
    const ob=document.createElement('button');ob.className='kn';
    ob.innerHTML='↩ Ontbind<small>laaste soldaat → boer</small>';
    ob.onclick=()=>ontbindLaaste();
    r.appendChild(ob);
  }
  const kl=document.createElement('button');kl.className='kn';kl.textContent='↩';
  kl.onclick=()=>{MODUS=null;wysPrompt(null);kiesGebou(null);};
  r.appendChild(kl);
}

function herstelKrygsmag(){
  for(const rec of (S.eenh||[])){

/* ============================== DIE VIER BROERS ==============================
   BFME se helde-grammatika op hierdie plaas: EEN van elk, duur om te roep, hulle
   verander die dorp om hulle, hulle KAN VAL, en hulle kom terug.

   DRIE REELS WAT DIE RES VAN DIE SPEL BESKERM:
   1. 'n Broer is NIE 'n mens nie. Hy staan nie in MENSE nie, dus eet hy niks
      (die kos-yking van 4 kos/dag/mond bly presies soos hy is), vat hy geen bed
      en steel hy geen werksplek. Hy is 'n vermenigvuldiger, nie 'n mond nie.
   2. Die plaas MUNT NIKS. Munte kom net uit die zombie-lopies (dbgz_v1) — hier
      word hulle net UITGEGEE. Dit is die een ekonomie-brug, en hy loop een rigting.
   3. Geluk bly 'n DRYF: broers voeg net RYE by gelukFaktore() (per dag), nooit 'n
      direkte skryf na S.geluk nie — met een uitsondering wat 'n eenmalige
      gebeurtenis is (Altus se koffie-krag), presies soos 'n dag se dryf.        */

const DBGZ_KEY='dbgz_v1';                 // die zombie-lopie se stoor — die muntbron
let MUNTE_KAS=0, munteKlok=0;
/* Ons LEES-WYSIG-SKRYF elke transaksie vars. 'n Gekaste SAVE wat teruggeskryf word
   sou die speler se lopie-vordering (best/skills/runs) uitvee as hy in 'n ander
   oortjie speel. Ontbreek die sleutel heeltemal, skryf ons NIKS — 'n halwe SAVE
   wat ons hier uitdink, is erger as geen munte nie. */
function munteLees(){
  try{
    const s=JSON.parse(localStorage.getItem(DBGZ_KEY));
    if(!s||typeof s!=='object')return 0;
    const n=+s.munte;
    return (isFinite(n)&&n>0)?Math.floor(n):0;
  }catch(e){return 0;}
}
function munteBetaal(n){
  try{
    const rou=localStorage.getItem(DBGZ_KEY);
    if(!rou)return false;
    const s=JSON.parse(rou);
    if(!s||typeof s!=='object')return false;
    const h=Math.floor(+s.munte||0);
    if(h<n)return false;
    s.munte=h-n;
    localStorage.setItem(DBGZ_KEY,JSON.stringify(s));
    MUNTE_KAS=s.munte;
    return true;
  }catch(e){return false;}
}

const BROER_MONDE=2;

const BROERS=[];                 // die LEWENDE broers (hoogstens vier)

const BR_KOOI={x:STOEP.x-92,y:STOEP.y+30};

/* 60 + 40 per VORIGE val, plafon 180: val 1 = 60, val 2 = 100, val 3 = 140, dan 180.

     (-3/dag) en 'n draer is uit produksie. Niks daarvan is permanent nie. */

function broerSkade(b,n){

/* ---------- aura-hake (die enigste plekke waar broers aan die sim raak) ---------- */
function bouTempo(site){
  let f=1;
  for(const b of BROERS){
    if(b.toestand!=='op'||b.id!=='louw')continue;
    const r=b.kragT>0?520:BROERT.louw.aura;
    if(dist2(b.x,b.y,site.x,site.y)<r*r)f=Math.max(f,b.kragT>0?2.0:1.15);
  }
  return f;
}
function auraSpoed(m){
  if(m.broer)return m.haas||1;
  let f=1;
  for(const b of BROERS){
    if(b.toestand!=='op'||b.id!=='danie')continue;
    if(b.kragT>0){f=Math.max(f,1.45);continue;}
    const r=BROERT.danie.aura;
    if(dist2(b.x,b.y,m.x,m.y)<r*r)f=Math.max(f,1.10);
  }
  return f;
}
/* RYE, nie 'n skryf nie — die humeur bly 'n dryf. */
function broerGeluk(rye){
  /* Net die WOND tel. Die agent se +2 per broer sou 'n staande +4 wees vir lywe wat net
     daar staan — 'n held is 'n geveg-bate; sy waarde is die zombies wat hy doodmaak. */
  const neer=broerNeer();
  if(neer)rye.push([neer===1?'’n Broer lê gewond':neer+' broers lê gewond',-3*neer,'gebeurtenis']);
}
GLBRONNE.push(rye=>broerGeluk(rye));

/* ---------- vyande ----------
   Vandag is die dwalers al vyand op hierdie kaart. Die lys is 'n FUNKSIE sodat
   die dag wanneer daar regte zombies en neste is, hierdie kode niks hoef te weet
   nie — een naam by, klaar. */
function brVyande(){
  const uit=[];
  for(const d of DWALERS)if(!d.dood)uit.push(d);
  if(typeof ZOMBIES!=='undefined'&&Array.isArray(ZOMBIES))
    for(const z of ZOMBIES)if(z&&!z.dood&&(z.hp===undefined||z.hp>0))uit.push(z);
  return uit;
}
function vyandSkade(e,n){
  if(e.hp===undefined)e.hp=DW_HP;
  e.hp-=n;
  spanne(e.x+rand(-6,6),e.y-14,3,'#7a3427');
  if(e.hp<=0){
    e.dood=true;e.veg=null;
    spanne(e.x,e.y-12,12,'#4e6b34');klank(110,.28,.18);
    return true;
  }
  klank(210+R()*60,.05,.09);
  return false;
}
/* Word EEN reël bo-aan die bestaande dwaler-lus ingehaak. Gee true terug as hierdie
   dwaler klaar gehanteer is (hy veg of hy knaag) — dan slaan die ou logika oor. */
function dwalerVeg(d,dt){
  if(d.dood)return false;
  if(d.hp===undefined)d.hp=DW_HP;
  // 1. 'n Broer wat op sy rug lê, trek hulle nader. Dit maak 'n redding spannend.
  if(!d.veg){
    let g=null;
    for(const b of BROERS)if(b.toestand==='geval'&&dist2(d.x,d.y,b.x,b.y)<520*520)g=b;
    if(g&&!KLOKAAN){
      const dx=g.x-d.x,dy=g.y-d.y,l=Math.hypot(dx,dy)||1;
      if(l>22){d.x+=dx/l*22*dt;d.y+=dy/l*22*dt;d.tred+=dt*4.6;}
      else{
        d.bytT=(d.bytT||0)+dt;
        if(d.bytT>=DW_BYTTYD){d.bytT=0;g.gevalT=Math.max(0,g.gevalT-6);   // hy vertraag die kruip
          spanne(g.x,g.y-6,3,'#c05038');klank(95,.12,.12);}
      }
      return true;
    }
  }
  // 2. 'n Broer binne sy pad: hy byt terug. 'n Dwaler vlug vir 'n gesonde man,
  //    maar nie vir een wat voor hom gaan staan nie.
  if(!d.veg||d.veg.toestand!=='op'||dist2(d.x,d.y,d.veg.x,d.veg.y)>260*260)d.veg=null;
  if(!d.veg){
    for(const b of BROERS){
      if(b.toestand!=='op')continue;
      if(dist2(d.x,d.y,b.x,b.y)<150*150){d.veg=b;break;}
    }
  }
  if(!d.veg)return false;
  const b=d.veg;
  d.tred+=dt*5.4;
  const dx=b.x-d.x,dy=b.y-d.y,l=Math.hypot(dx,dy)||1;
  if(l>20){d.x+=dx/l*46*dt;d.y+=dy/l*46*dt;}     // vegtend is hy vinniger as dwalend
  else{
    d.bytT=(d.bytT||0)+dt;
    if(d.bytT>=DW_BYTTYD){
      d.bytT=0;
      /* SNAGS BYT HY HARDER. Dit is die enigste plek waar die val werklik dreig
         solank die kaart net dwalers het: 'n broer wat die hele nag buite bly,
         verweer stadig — 'n keuse van die speler, nie 'n dobbelsteen nie. */
      broerSkade(b,Math.round(DW_BYT*(nagAlpha()>.3?1.5:1)));
    }
  }
  return true;
}

/* ---------- die broer se eie lus ---------- */
function broerStap(b,tx,ty,dt){return stapNa(b,tx,ty,dt);}
function broerLoop(b,dt){
  const T2=BROERT[b.id];
  if(b.sê>0)b.sê-=dt;
  if(b.kragCd>0)b.kragCd-=dt;
  if(b.kragT>0)b.kragT-=dt;
  if(b.id==='pa'&&b.kragT>0){                     // 'Staan vas': niks kom naby die werf nie
    for(const d of DWALERS)if(dist2(d.x,d.y,WERF.x,WERF.y)<500*500){d.weg=true;d.veg=null;}
  }
  if(b.skoot>0)b.skoot-=dt;

  if(b.toestand==='gedra'){
    const m=b.draer;
    if(!m||!MENSE.includes(m)||m.help!==b){b.toestand='geval';b.draer=null;b.eis=0;return;}
    b.x=m.x+6*(m.rig<0?-1:1);b.y=m.y-2;           // hy hang oor die skouer
    return;
  }
  if(b.toestand==='geval'){
    if(b.eis&&!MENSE.includes(b.eis))b.eis=0;   // sy redder is weg — die pos is weer oop
    b.gevalT+=dt;
    if(b.gevalT>BR_KRUIP&&!b.eis){                // niemand het gekom nie — hy sleep self
      if(broerStap(b,BR_KOOI.x,BR_KOOI.y,dt*.22))broerInKooi(b);
    }
    return;
  }
  if(b.toestand==='gewond'){
    b.x+=(BR_KOOI.x-b.x)*Math.min(1,dt*2);b.y+=(BR_KOOI.y-b.y)*Math.min(1,dt*2);
    b.herstelT-=dt;
    b.hp=Math.max(1,Math.round(b.maxhp*.55*(1-b.herstelT/BR_HERSTEL)));
    if(b.herstelT<=0)broerHerleef(b,true);
    return;
  }
  /* --- toestand 'op' --- */
  if(b.inkom){                                     // die intog: hy stap self werf toe
    if(broerStap(b,b.pos.x,b.pos.y,dt))b.inkom=0;
    return;
  }
  // die klok roep die MENSE binne; die broers gaan staan voor die stoep.
  const pos=KLOKAAN?{x:STOEP.x+(BROER_ORDE.indexOf(b.id)-1.5)*34,y:STOEP.y+52}:b.pos;
  // vyand kies: geleiband om sy POS, nie om homself nie — anders jaag hy tot in die nag in
  let v=null,vd=1e12;
  for(const e of brVyande()){
    if(e.weg&&!brNaby(e,WERF,420))continue;        // een wat wegdraai, laat ons loop
    const dp=dist2(e.x,e.y,pos.x,pos.y);
    if(dp>BR_LEIBAND*BR_LEIBAND)continue;
    const dm=dist2(e.x,e.y,b.x,b.y);
    if(dm<vd){vd=dm;v=e;}
  }
  b.doel=v;
  if(v){
    const reik=T2.reik;
    if(vd>reik*reik){broerStap(b,v.x,v.y,dt);}
    else{
      b.rig=v.x<b.x?-1:1;
      b.slaan+=dt;
      if(b.slaan>=T2.tempo){
        b.slaan=0;
        if(b.id==='pa'){b.skoot=.12;klank(140,.16,.2);}
        const dood=vyandSkade(v,T2.skade);
        if(dood&&R()<.5){b.sê=1.6;}
      }
    }
    return;
  }
  b.slaan=0;
  /* Genees NET by die huis. Dit is hoekom 'n broer wat jy heeltyd buite hou,
     uiteindelik val: verwering, nie 'n dobbelsteen nie. */
  if(brNaby(b,WERF,240)&&b.hp<b.maxhp)b.hp=Math.min(b.maxhp,b.hp+1.6*dt);
  if(!broerStap(b,pos.x,pos.y,dt))return;
  b.tred+=dt*1.4;
}
function broerInKooi(b){
  b.toestand='gewond';b.herstelT=BR_HERSTEL;b.hp=1;b.eis=0;b.draer=null;
  b.x=BR_KOOI.x;b.y=BR_KOOI.y;
  plToast(BROERT[b.id].naam+' lê op die stoep. Hy staan self op oor ’n dag.');
  klank(240,.2,.12);
  broerStoor();persistSoon();brPaneel();
}

/* ---------- die redding: die dorp se eie dra-ketting ---------- */
function broerTeRed(m){
  let beste=null,bd=1e12;
  for(const b of BROERS){
    if(b.toestand!=='geval'||b.eis)continue;
    const d=dist2(m.x,m.y,b.x,b.y);
    if(d<bd){bd=d;beste=b;}
  }
  return beste;
}
function broerLosDra(m,b){
  b=b||m.help;
  if(!b)return;
  if(b.toestand==='gedra'){b.toestand='geval';b.gevalT=0;}
  if(b.eis===m)b.eis=0;
  b.draer=null;
  if(m.help===b)m.help=null;
}

/* ---------- stoor ---------- */
function broerStoor(){
  S.broers=BROERS.map(b=>[b.id,b.toestand,Math.round(b.x),Math.round(b.y),
                          Math.round(b.hp),b.valTel|0,Math.round(b.herstelT||0)]);
}
function broerLaai(){
  MUNTE_KAS=munteLees();
  for(const rec of (S.broers||[])){
    const [id,toestand,x,y,hp,valTel,herstelT]=rec;
    if(!BROERT[id]||broer(id))continue;
    const T2=BROERT[id];
    const b={id,broer:true,x:x||WERF.x,y:y||WERF.y,
      hp:clamp(hp||T2.hp,0,T2.hp),maxhp:T2.hp,spd:T2.spd,dra:null,rig:1,tred:0,slaan:0,haas:1,
      toestand:(toestand==='gedra')?'geval':(toestand||'op'),
      pos:{x:WERF.x+rand(-90,90),y:WERF.y+rand(70,150)},
      doel:null,bytT:0,skoot:0,kragCd:0,kragT:0,valTel:valTel||0,
      herstelT:herstelT||0,gevalT:0,draer:null,eis:0,sê:0,inkom:0};
    if(b.toestand==='gewond'&&b.herstelT<=0)b.herstelT=8;
    if(b.toestand==='op'&&b.hp<=0)b.hp=Math.round(T2.hp*.5);
    BROERS.push(b);
  }
}

/* ---------- die paneel ---------- */
let brOop=false, brPaneelT=0, broerAuraWas=false;
function brPaneel(){
  const k=document.getElementById('brkaart');
  if(!k)return;
  if(!brOop){k.style.display='none';return;}
  let h='';
  for(const id of BROER_ORDE){
    const T2=BROERT[id], b=broer(id);
    let reg='', kn='';
    if(!b){
      const ok=broerVereisOk(id), genoeg=MUNTE_KAS>=T2.koste;
      reg='<span class="dof">'+(ok?T2.koste+' 🪙':broerVereisTeks(id))+'</span>';
      kn='<button class="kn brkn" data-roep="'+id+'"'+((ok&&genoeg)?'':' disabled')+'>Roep op</button>';
    }else if(b.toestand==='op'){
      reg='<span class="op">'+Math.round(b.hp)+'/'+b.maxhp+' ❤</span>';
      kn='<button class="kn brkn" data-krag="'+id+'"'+(b.kragCd>0?' disabled':'')+'>'+
         (b.kragCd>0?Math.ceil(b.kragCd)+'s':T2.kragNaam)+'</button>';
    }else if(b.toestand==='gewond'){
      reg='<span class="af">Gewond · '+Math.ceil(b.herstelT)+'s</span>';
      kn='<button class="kn brkn" data-lap="'+id+'"'+(MUNTE_KAS>=herleefKoste(b)?'':' disabled')+
         '>Lap op ('+herleefKoste(b)+' 🪙)</button>';
    }else{
      reg='<span class="af">'+(b.toestand==='gedra'?'Word gedra':'Het geval')+'</span>';
      kn='<span class="dof" style="font-size:16px">hulle kom hom haal</span>';
    }
    h+='<div class="brry"><span class="brnm" style="color:'+T2.pkleur+'">'+T2.ikoon+' '+T2.naam+'<small>'+T2.titel+(b&&b.valTel?' · '+b.valTel+'× geval':'')+
       '</small></span>'+reg+kn+'</div>';
  }
  h+='<div class="brvoet">🪙 '+MUNTE_KAS+' munte · verdien hulle in die zombie-lopies</div>';
  k.innerHTML=h;
  k.style.display='block';
  k.querySelectorAll('button[data-roep]').forEach(x=>x.onclick=()=>roepBroer(x.dataset.roep));
  k.querySelectorAll('button[data-krag]').forEach(x=>x.onclick=()=>broerKrag(broer(x.dataset.krag)));
  k.querySelectorAll('button[data-lap]').forEach(x=>x.onclick=()=>broerHerleef(broer(x.dataset.lap),false));
}
/* Een reël in bouBalk() se else-tak roep hierdie: die paneel-knoppie, plus die
   gekose broer se krag as 'n GROOT duimteiken onder — 'n foon-speler moet nie 'n
   paneel hoef oop te maak om 'n krag te gebruik nie. */
function broerKnoppie(r){
  const bk=document.createElement('button');
  bk.className='kn'+(brOop?' aan':'');
  bk.innerHTML='🎖️ Broers<small>'+BROERS.filter(b=>b.toestand==='op').length+'/4</small>';
  bk.onclick=()=>{brOop=!brOop;brPaneel();bouBalk();};
  r.appendChild(bk);
  if(BRSEL&&BRSEL.toestand==='op'){
    const T2=BROERT[BRSEL.id];
    const kb=document.createElement('button');
    kb.className='kn groen'+(BRSEL.kragCd>0?' kan_nie':'');
    kb.innerHTML=T2.ikoon+' '+T2.kragNaam+'<small>'+
      (BRSEL.kragCd>0?Math.ceil(BRSEL.kragCd)+'s':'gereed')+'</small>';
    kb.onclick=()=>{if(broerKrag(BRSEL))bouBalk();};
    r.appendChild(kb);
  }
}

/* ---------- tik: kies en beveel ---------- */
function broerOnder(wx,wy){
  let beste=null,bd=1e12;
  for(const b of BROERS){
    if(b.toestand==='gedra')continue;
    const d=dist2(wx,wy,b.x,b.y-12);
    if(d<34*34&&d<bd){bd=d;beste=b;}
  }
  return beste;
}
function kiesBroer(b){
  BRSEL=b;
  if(b){kiesGebou(null);klank(560,.06,.09);}
  bouBalk();brPaneel();
}
function broerRaak(wx,wy){
  if(MODUS==='merk')return false;                 // boom-merk bly die baas van sy modus
  const b=broerOnder(wx,wy);
  if(b){
    if(b.toestand==='gewond'&&BRSEL===b){broerHerleef(b,false);return true;}
    kiesBroer(BRSEL===b?null:b);
    return true;
  }
  if(BRSEL&&BRSEL.toestand==='op'&&!gebOnder(wx,wy)){
    BRSEL.pos={x:wx,y:wy};BRSEL.inkom=0;
    spanne(wx,wy,6,'#e8c96a');klank(440,.05,.08);
    return true;
  }
  return false;
}

/* ---------- die raam-inskrywing (een reël in update()) ---------- */
function broerOpdateer(dt){
  for(const b of BROERS)broerLoop(b,dt);
  /* Danie se aura as 'n VELD op elke mens — spoedVan(m) lees m.aSpoed. Ons skryf 1 terug
     as geen broer op die veld is nie, sodat 'n ou aura nie bly hang nie. */
  if(BROERS.length||broerAuraWas){for(const m of MENSE)m.aSpoed=auraSpoed(m);broerAuraWas=!!BROERS.length;}
  munteKlok-=dt;
  if(munteKlok<=0){                    // die ander oortjie kan intussen munte verdien het
    munteKlok=2;MUNTE_KAS=munteLees();broerStoor();
    /* Geen munt-chip in die werf-HUD: munte is LOPIE-geld en woon in die broers se paneel. */
  }
  if(brOop){brPaneelT-=dt;if(brPaneelT<=0){brPaneelT=.4;brPaneel();}}
  if(BRSEL&&BRSEL.toestand!=='op'&&BRSEL.toestand!=='gewond')BRSEL=null;
}

/* ---------- verf ---------- */
const T_BROER=verwerId(tekenBroer);   // eie verwer-nommer; nooit 'n hardgekodeerde 6
function tekenBroer(b){
  const T2=BROERT[b.id];
  const lê=(b.toestand==='geval'||b.toestand==='gewond');
  const x=b.x,y=b.y;
  /* DIE HELD-RING. By uitgezoemde kamera is 'n mens 20px hoog en kan jy geen naam
     lees nie — die ring is die enigste ding wat op 'n foon sê "dit is 'n broer". */
  ctx.strokeStyle=(BRSEL===b)?'#ffe9a8':(lê?'rgba(192,80,56,.7)':'rgba(224,182,79,.6)');
  const z=Math.max(KAM.z,.05);
  ctx.lineWidth=((BRSEL===b)?3:2)/z;
  if(BRSEL===b)ctx.setLineDash([6/z,5/z]);
  ctx.beginPath();ctx.ellipse(x,y+3,14,6,0,0,TAU);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='rgba(10,14,7,.35)';
  ctx.beginPath();ctx.ellipse(x,y+2,10,3.6,0,0,TAU);ctx.fill();

  ctx.save();ctx.translate(x,y);
  if(lê){ctx.rotate(b.id==='pa'?-1.35:1.35);ctx.translate(0,-4);}
  ctx.scale(1.22,1.22);
  if(!lê&&b.rig<0)ctx.scale(-1,1);
  const stap=lê?0:Math.sin(b.tred)*2.4;
  // bene
  ctx.fillStyle='#2a1f12';ctx.fillRect(-4+stap,-6,3.5,7);ctx.fillRect(1-stap,-6,3.5,7);
  // mantel (Altus) agter die lyf
  if(b.id==='altus'){ctx.fillStyle='#3a4356';ctx.fillRect(-7,-20,14,15);
    ctx.strokeStyle='#14180e';ctx.lineWidth=1.6;ctx.strokeRect(-7,-20,14,15);}
  // lyf
  ctx.fillStyle=T2.kleur;ctx.fillRect(-5.5,-20,11,14);
  ctx.fillStyle='rgba(226,240,180,.3)';ctx.fillRect(-5.5,-20,2.5,14);
  // pylkoker (Danie) / epoulette (Pa)
  if(b.id==='danie'){ctx.fillStyle='#6a4a30';ctx.fillRect(-8,-19,3,9);}
  if(b.id==='pa'){ctx.fillStyle='#e0b64f';ctx.fillRect(-6,-20,12,2.4);}
  // kop
  ctx.fillStyle=b.id==='pa'?'#e2b18d':'#dfa987';ctx.fillRect(-4,-28,8,8);
  ctx.fillStyle=T2.hare;ctx.fillRect(-4,-30,8,3);
  if(b.id==='louw'){ctx.fillStyle='#22282e';ctx.fillRect(-5.5,-28,1.8,4);ctx.fillRect(3.7,-28,1.8,4);}
  // wapen
  if(!lê){
    const sw=Math.sin(clamp(b.slaan/T2.tempo,0,1)*Math.PI);
    ctx.save();ctx.translate(4,-16);
    if(b.id==='pa'){
      ctx.rotate(b.doel?-.15:.5);
      ctx.fillStyle='#4a4a44';ctx.fillRect(0,-1.4,9,2.8);
      ctx.fillStyle='#5d4a2c';ctx.fillRect(-2,-1,4,4);
      if(b.skoot>0){ctx.fillStyle='#ffe0a0';ctx.beginPath();
        ctx.moveTo(9,-3);ctx.lineTo(17,0);ctx.lineTo(9,3);ctx.closePath();ctx.fill();}
    }else{
      ctx.rotate(-.7+sw*1.7);
      ctx.fillStyle='#5d4a2c';ctx.fillRect(0,-1.8,14,3.6);
      if(b.id==='louw'){ctx.fillStyle='#9aa0a2';ctx.fillRect(12,-5.5,7,11);
        ctx.strokeStyle='#14180e';ctx.lineWidth=1.4;ctx.strokeRect(12,-5.5,7,11);}
      else if(b.id==='danie'){ctx.fillStyle='#8a929e';ctx.fillRect(12,-2.4,6,4.8);}
      else{ctx.fillStyle='#e8c96a';ctx.beginPath();ctx.arc(15,0,4,0,TAU);ctx.fill();}
    }
    ctx.restore();
  }
  ctx.strokeStyle='rgba(20,24,14,.8)';ctx.lineWidth=2;
  ctx.strokeRect(-5.5,-20,11,14);ctx.strokeRect(-4,-28,8,8);
  ctx.restore();

  // naamplaat — ALTYD sigbaar (anders as die mense s'n) want dit is 'n held
  ctx.font='15px VT323, monospace';ctx.textAlign='center';
  ctx.fillStyle=lê?'#c05038':'#e8c96a';
  ctx.fillText(T2.naam+(lê?' ⚑':''),x,y-40);
  // lewensbalk: net wanneer dit saak maak
  if(b.toestand==='op'&&b.hp<b.maxhp){
    const w=30,f=clamp(b.hp/b.maxhp,0,1);
    ctx.fillStyle='rgba(10,14,7,.8)';ctx.fillRect(x-w/2,y-38,w,5);
    ctx.fillStyle=f>.5?'#7fc95e':f>.25?'#e0b64f':'#c05038';
    ctx.fillRect(x-w/2+1,y-37,(w-2)*f,3);
  }
  if(b.toestand==='gewond'){
    const f=1-clamp(b.herstelT/BR_HERSTEL,0,1),w=30;
    ctx.fillStyle='rgba(10,14,7,.8)';ctx.fillRect(x-w/2,y-38,w,5);
    ctx.fillStyle='#8fd06a';ctx.fillRect(x-w/2+1,y-37,(w-2)*f,3);
  }
  if(b.kragT>0){                      // 'n aktiewe krag moet SIGBAAR wees
    ctx.strokeStyle='rgba(232,201,106,.5)';ctx.lineWidth=2;
    const r=BROERT[b.id].aura*.28+Math.sin(T*4)*3;
    ctx.beginPath();ctx.ellipse(x,y+3,r,r*.42,0,0,TAU);ctx.stroke();
  }
  if(b.sê>0){
    ctx.fillStyle='rgba(232,201,106,'+Math.min(1,b.sê)+')';
    ctx.font='16px VT323, monospace';ctx.fillText('!',x+10,y-46);
  }
  if(b.id==='pa'&&PA.lynT>0){         // Pa se stem loop saam met sy lyf
    ctx.font='17px VT323,monospace';
    const w=ctx.measureText(PA.lyn).width+16;
    ctx.fillStyle='rgba(10,14,7,.85)';ctx.fillRect(x-w/2,y-70,w,22);
    ctx.strokeStyle='#5c4a2e';ctx.lineWidth=2;ctx.strokeRect(x-w/2,y-70,w,22);
    ctx.fillStyle='#ece5cc';ctx.fillText(PA.lyn,x,y-54);
  }
}

/* ============================================================================
   ZOMBIE-NESTE — die rede om die werf te verlaat.

   Die plaas kan homself voed en bou en dan stilstaan. Die nes is die klok wat
   nie ophou tik nie: hy broei, hy ryp, en wat hy uitstuur vreet die spens leeg.
   Die enigste antwoord is om MENSE WEG TE VAT van die werk af en uit te marsjeer
   — en dít is die prys, want terwyl hulle weg is, groei niks en delf niemand.

   DRIE BANDE, geyk op die stapper (52 px/s) en die dag (240s):
     band 0  600-900px    ~15s stap    die eerste oorwinning, leer die lus
     band 1  980-1320px   ~22s stap    kos ’n behoorlike kommando
     band 2 1380-1760px   ~29s stap    ’n halwe dag se werk; net ’n groot dorp haal dit

   RYPING is die dryf: laat staan hom en hy klim vlak 1 -> 3, kry meer lewe,
   broei vinniger en byt harder. Die spel se rigting is dus altyd "watter nes
   eerste", nooit "niks om te doen nie".

   KOS-YKING WORD GERESPEKTEER: ’n zombie by die werf steel EEN kos elke 14s en
   loop na 55s weg — ±4 kos per besoek. Een tuinier lewer ~16 kos/dag, so een
   vlak-1 nes vreet omtrent ’n derde van ’n tuinier op. Drie ryp neste vreet twee.
   DRYF-GEWILDHEID WORD GERESPEKTEER: neste voeg RYE by gelukFaktore(), hulle
   skryf nooit self aan S.geluk nie.
   ============================================================================ */

/* Band-tabel. hp is in HOUE (een houe elke 0.9s per man, presies die kap-ritme),
   byt is sekondes tussen bytwonde. Gemeet: band0/vlak1 val in ~22s voor vier man
   en kos ±1 wond elk; band2/vlak3 vra agt man. */
const NES_BANDE=[
  {min: 600,maks: 900,hp: 96,byt:4.4,munt: 6,buit:{hout: 5,klip:2},rypDae:3.0,broei:165,dreig:-4},
  {min: 980,maks:1320,hp:140,byt:3.6,munt:11,buit:{hout: 9,klip:4},rypDae:4.0,broei:198,dreig:-3},
  {min:1380,maks:1760,hp:190,byt:3.0,munt:18,buit:{hout:13,klip:7},rypDae:5.5,broei:231,dreig:-2},
];
const NES_MAKSVLAK=3;
const NES_HPVLAK=34;          // ekstra lewe per rypingsvlak
const NES_NAME=['die Ou Kraal','die Spruit','die Doringdig','die Sinkdam','die Kloof',
                'die Bult','die Vlei','die Klipkop','die Ou Werf','die Leegte'];
const NES_UIT=[2,3,4];        // hoeveel zombies gelyk uit een nes mag loop
const KOM_GROOTTES=[4,6,8,10];// kommando-grootte; die speler kies (4 is die kleinste wat wen)
const KOM_FAKKEL=1;           // een fakkel, een hout per man — ’n uitmars kos materiaal
const NES_WONDBREEK=3;        // by drie wonde breek ’n man en hardloop huis toe
const NES_STEEL=14;           // sekondes tussen kos-diefstalle by die werf
const NES_BINNE=55;           // hoe lank ’n zombie by die werf bly voor hy wegdwaal

const NESTE=[];
let NESKIES=null;             // die gekose nes (deel die #gebkaart met geboue)
let nesNaamI=0, nesSaaiT=0, nesKaartT=0;

function nesNaam(i){return NES_NAME[i%NES_NAME.length];}
function nesMaksHp(n){return NES_BANDE[n.band].hp+NES_HPVLAK*(n.vlak-1);}
function nesBytT(n){
  const basis=Math.max(1.4,NES_BANDE[n.band].byt-0.5*(n.vlak-1));
  /* Snags byt hy 1.6x vinniger. Dít is die hele rede om die dag te lees voor jy
     uitstap — en dit maak die dag/nag-siklus ’n taktiese ding, nie net beligting. */
  return nagAlpha()>0.35?basis*0.62:basis;
}
function nesBroeiT(n){return NES_BANDE[n.band].broei*[1,0.72,0.52][n.vlak-1];}
function nesAfstand(n){return Math.hypot(n.x-WERF.x,n.y-WERF.y);}
function nesMunt(n){return NES_BANDE[n.band].munt+4*(n.vlak-1);}
function nesBuit(n){
  const b=NES_BANDE[n.band].buit;
  return {hout:b.hout+(n.vlak-1),klip:b.klip+(n.vlak-1)};
}
/* HOEVEEL MAN? Die speler mag nie hierdie som in sy kop hoef te doen nie. Die
   maatstaf is die nes se lewe gedeel deur hoe vinnig hy byt (albei in sekondes),
   en die drempels kom uit die simulasie: onder 25 wen vier man skoon, onder 45
   vat dit ses, onder 75 agt, daarbo tien. Snags weeg dit 1.6x swaarder. */
function nesAanbeveel(n){
  const maat=nesMaksHp(n)*0.9/nesBytT(n);
  return maat<25?4:maat<45?6:maat<75?8:10;
}
function nesLewendes(n){
  let k=0;for(const d of DWALERS)if(d.nes===n&&!d.weg&&!d.dood)k++;
  return k;
}
function nuweNes(x,y,band,ni){
  const n={x,y,band,vlak:1,naam:nesNaam(ni),ni,ryp:0,broeiT:NES_BANDE[band].broei*0.55,
           hp:0,puls:0,skud:0,bytT:2,rusT:0,gesien:0,dood:false};
  n.hp=nesMaksHp(n);
  return n;
}
/* Waar mag ’n nes staan? Nie in die water, nie op die klipbank, nie op die werf
   se drumpel, en nie bo-op mekaar nie — anders lyk twee neste soos een. */
function nesPlekVry(x,y){
  if(x<150||x>WW-150||y<150||y>WH-150)return false;
  const dx=(x-DAM.x)/(DAM.rx+90),dy=(y-DAM.y)/(DAM.ry+80);
  if(dx*dx+dy*dy<1)return false;
  if(dist2(x,y,KLIPBANK.x,KLIPBANK.y)<(KLIPBANK.r+90)*(KLIPBANK.r+90))return false;
  if(dist2(x,y,WERF.x,WERF.y)<520*520)return false;
  for(const q of NESTE)if(dist2(x,y,q.x,q.y)<360*360)return false;
  for(const g of GEB)if(dist2(x,y,g.x,g.y)<200*200)return false;
  return true;
}
function nesPlek(band){
  const B=NES_BANDE[band];
  for(let i=0;i<80;i++){
    const a=R()*TAU, d=B.min+R()*(B.maks-B.min);
    /* y word saamgedruk (die wêreld is 3200x2400, so ’n suiwer sirkel op band 2
       val bo en onder buite die kaart uit), MAAR ons deel weer deur die skaal
       sodat die WERKLIKE afstand presies d bly. Sonder hierdie deling lê ’n
       "verre" nes wat toevallig noord gesaai is nader as ’n band-0 nes, en dan
       lieg die hele band-tabel oor sy stap-tyd. */
    const sk=Math.hypot(Math.cos(a),Math.sin(a)*0.74)||1;
    const x=WERF.x+Math.cos(a)*d/sk, y=WERF.y+Math.sin(a)*0.74*d/sk;
    if(nesPlekVry(x,y))return {x,y};
  }
  return null;
}
function saaiNeste(){
  NESTE.length=0;nesNaamI=0;
  const tel=[1,2,2];                 // een naby om op te leer, vier om na toe te groei
  for(let b=0;b<3;b++)for(let k=0;k<tel[b];k++){
    const p=nesPlek(b);
    if(p)NESTE.push(nuweNes(p.x,p.y,b,nesNaamI++));
  }
}

/* ============================== RYPING EN BROEI ============================== */
function nesteTik(dt){
  nesTorings();
  for(let i=NESTE.length-1;i>=0;i--){
    const n=NESTE[i];
    if(n.skud>0)n.skud-=dt;
    n.puls+=dt;

    // RYPING — die stil dryf. ’n Nes wat jy ignoreer, word ’n ander nes.
    if(n.vlak<NES_MAKSVLAK){
      n.ryp+=dt;
      if(n.ryp>=NES_BANDE[n.band].rypDae*VOLLEDAG){
        n.ryp=0;n.vlak++;n.hp=nesMaksHp(n);n.skud=1.2;
        klank(90,.5,.16);spanne(n.x,n.y-10,10,'#6f9a3a');
        paSê('Die nes by '+n.naam+' het gegroei.');
        plToast(n.naam+' se nes is nou vlak '+n.vlak+'.');
        persistSoon();
      }
    }

    // BROEI — hy stuur uit, maar nooit meer as sy plek kan hou nie
    n.broeiT-=dt;
    if(n.broeiT<=0){
      n.broeiT=nesBroeiT(n);
      if(nesLewendes(n)<NES_UIT[n.vlak-1]){
        maakNesDwaler(n);n.skud=.5;
        klank(70,.28,.12);spanne(n.x,n.y-6,6,'#7a9a4a');
        if(!n.gesien){n.gesien=1;plToast('Iets kom uit '+n.naam+' uit.');persistSoon();}
      }
    }

    // GEVEG — die nes byt terug. Aanvallers word GETEL, nie geregistreer nie,
    // sodat ’n man wat breek of val vanself uit die telling verdwyn.
    let aanvTel=0;
    for(const m of MENSE)
      if(m.taak&&m.taak.tipe==='storm'&&m.taak.nes===n&&m.taak.fase===1)aanvTel++;
    const teiken=nesKies(n);
    if(teiken){
      n.bytT-=dt;
      if(n.bytT<=0){n.bytT=nesBytT(n);nesByt(n,teiken);}
    }
    if(aanvTel>0){n.rusT=0;}
    else{
      /* GENEES NA ’N MISLUKTE AANVAL. Sonder dit kan die speler ’n nes in tien
         gratis happies afbreek; met dit is ’n teruggeslane kommando ’n WERKLIKE
         verlies — die fakkelhout is op, die wonde is daar, en die nes staan weer. */
      n.rusT+=dt;
      if(n.rusT>20&&n.hp<nesMaksHp(n))n.hp=Math.min(nesMaksHp(n),n.hp+4*dt);
    }
    if(n.hp<=0)nesVal(n,i);
  }

  // HERSAAI — die veld bly nooit lank skoon nie; die spel moet rigting hou.
  if(NESTE.length<3){
    nesSaaiT-=dt;
    if(nesSaaiT<=0){
      nesSaaiT=4*VOLLEDAG;
      const b=NESTE.length===0?2:1+((R()*2)|0);   // nooit weer reg op die drumpel
      const p=nesPlek(b);
      if(p){
        NESTE.push(nuweNes(p.x,p.y,b,nesNaamI++));
        paSê('Daar’s ’n nuwe nes ver in die veld.');
        plToast('’n Nuwe nes by '+NESTE[NESTE.length-1].naam+'.');
        klank(80,.4,.13);persistSoon();
      }
    }
  }else nesSaaiT=4*VOLLEDAG;

  nesHud();
  nesKaartT-=dt;
  if(nesKaartT<=0){nesKaartT=.4;if(NESKIES)kiesNes(NESKIES);}
}

/* ============================== DIE BYT ==============================
   Die byt-poel is die manne WAT SLAAN, plus dié wat pas gebreek het en nog binne
   die nes se bereik kruip. Dit is die hele dood-reël: ’n gewonde man wat betyds
   uitkom, leef; een wat gebreek terwyl die nes nog vinnig byt, kom nie uit nie.
   Daarom is ’n TE KLEIN kommando die duurste fout — die bytte kom vinniger as
   wat die gebrokenes kan wegkom. */
function nesKies(n){
  let keuse=null,tel=0;
  for(const m of MENSE){
    const slaan=!!(m.taak&&m.taak.tipe==='storm'&&m.taak.nes===n&&m.taak.fase===1);
    const kruip=(m.wond||0)>=NES_WONDBREEK&&m.vlug>0&&dist2(m.x,m.y,n.x,n.y)<260*260;
    if(!slaan&&!kruip)continue;
    tel++;if(R()<1/tel)keuse=m;          // eweredige keuse sonder ’n tweede lys
  }
  return keuse;
}
function nesByt(n,m){
  if(!m)return;
  if((m.wond||0)>=NES_WONDBREEK){nesSterf(m,n);return;}
  m.wond=(m.wond||0)+1;
  spanne(m.x,m.y-14,5,'#c05038');klank(120,.16,.13);
  if(m.wond>=NES_WONDBREEK){
    /* BREEK. Die vlug-blok bo in mensTik vat hom stoep toe — ons hoef net sy
       taak te los. Hy bly LEWE en genees ’n wond per dag: die prys is sy arbeid. */
    m.taak=null;m.vlug=Math.max(m.vlug||0,5);
    plToast(m.naam+' het teruggeval — gewond.');klank(150,.2,.12);
  }
}
function nesSterf(m,n){
  const i=MENSE.indexOf(m);
  if(i<0)return;
  if(m.werkplek){const k=m.werkplek.werkers.indexOf(m);if(k>=0)m.werkplek.werkers.splice(k,1);}
  MENSE.splice(i,1);
  spanne(m.x,m.y-12,16,'#c05038');klank(60,.6,.2);
  S.nesRou=Math.min(12,(S.nesRou||0)+5);
  plToast(m.naam+' het nie teruggekom nie.');
  paSê('Ons het ’n mens by '+n.naam+' verloor.');
  bemanGeboue();persistSoon();
}

/* ============================== DIE NES VAL ============================== */
function nesVal(n,i){
  NESTE.splice(i,1);
  n.dood=true;
  spanne(n.x,n.y-8,26,'#e8c96a');spanne(n.x,n.y,14,'#6f9a3a');
  klank(160,.5,.2);setTimeout(()=>klank(660,.3,.16),160);
  for(const d of DWALERS)if(d.nes===n)d.weg=true;      // sy goed verstrooi

  const munt=nesMunt(n);
  goudBy(munt);                        // WERF-geld: neste betaal in S.goud, nooit in lopie-munte
  S.nesRoem=Math.min(12,(S.nesRoem||0)+6);

  /* DIE BUIT LOOP OP BENE HUIS TOE — die grondreël: geen getal verander sonder
     dat ’n lyf beweeg nie. Elke oorlewende vat een vrag; wat oorbly, lê op die
     grond en die dorp gaan haal dit later (die 'dra'-taak doen dit vanself). */
  const buit=nesBuit(n);
  let hout=buit.hout, klip=buit.klip;
  for(const m of MENSE){
    if(!(m.taak&&m.taak.tipe==='storm'&&m.taak.nes===n))continue;
    m.taak=null;
    if(m.dra)continue;
    if(hout>0){m.dra='hout';hout--;}
    else if(klip>0){m.dra='klip';klip--;}
    else m.taak={tipe:'stap',tx:STOEP.x+rand(-60,60),ty:STOEP.y+rand(-10,20)};
    /* Sonder taak en MET ’n vrag vat die vangnet in mensTik hom hoop toe. */
  }
  let los=Math.min(8,hout+klip);          // hoogstens agt los vragte — nie ’n valstrik
  for(let k=0;k<los;k++){
    const soort=hout>0?(hout--,'hout'):(klip--,'klip');
    VRAGTE.push({x:n.x+rand(-40,40),y:n.y+rand(10,44),soort,geëis:0});
  }
  paSê(n.naam+' se nes is uitgebrand. '+munt+' goud.');
  plToast('Nes vernietig — '+munt+' 🪙 goud, buit kom huis toe.');
  if(NESKIES===n)kiesNes(null);
  persistSoon();
}

/* ============================== DIE ZOMBIES ==============================
   Hulle deel die DWALERS-lys (dieselfde verwer, dieselfde geluk-ry), maar loop
   hul eie roete: ’n dwaler dwaal, ’n nes-zombie KOM. Die vlag d.eie laat die
   bestaande dwaler-lus hulle oorslaan. */
function maakNesDwaler(n){
  const a=R()*TAU;
  DWALERS.push({x:n.x+Math.cos(a)*26,y:n.y+Math.sin(a)*18,
    tred:R()*TAU,leiband:0,jaag:0,weg:false,
    eie:1,nes:n,spd:18+2.5*n.vlak,stealT:NES_STEEL,binneT:NES_BINNE,
    leefT:NES_BINNE*6,vlak:n.vlak});
}
/* Die toringlys word EEN keer per raam gebou, nie een keer per zombie nie —
   met vier neste vol is dit twintig soektogte deur GEB per raam op 'n foon. */
let NES_TORINGS=[];
function nesTorings(){
  NES_TORINGS.length=0;
  for(const g of GEB)if(g.klaar&&GT[g.tipe].lig)NES_TORINGS.push(g);
}
function nesDwalerTik(d,dt){
  d.tred+=dt*4.6;
  /* Harde leeftyd. Sonder dit sirkel 'n zombie wat deur 'n wagtoring uitgehou
     word vir ewig om die werf en die dreigement-telling kom nooit weer af nie. */
  d.leefT-=dt;if(d.leefT<=0)d.weg=true;
  let vx,vy;

  /* ’n WAGTORING IS ’N WERKLIKE MUUR vir hulle: hulle kan nie binne sy kring kom
     nie en skuur daarom om die werf. Vlak 1 hou 180px, vlak 3 hou 300px — dít is
     wat die toring se opgradering nou werd is. */
  let stoot=null;
  for(const g of NES_TORINGS){
    const r=120+60*gVlak(g);
    if(dist2(d.x,d.y,g.x,g.y)<r*r){stoot=g;break;}
  }

  if(d.weg){
    vx=d.x-WERF.x;vy=d.y-WERF.y;
  }else if(stoot){
    vx=d.x-stoot.x;vy=d.y-stoot.y;
  }else{
    // die naaste mens buite die stoep, anders reguit werf toe
    let doel=null,bd=340*340;
    for(const m of MENSE){
      if(m.taak&&m.taak.tipe==='storm')continue;      // soldate skrik hom nie af nie
      if(dist2(m.x,m.y,STOEP.x,STOEP.y)<70*70)continue;
      const q=dist2(d.x,d.y,m.x,m.y);
      if(q<bd){bd=q;doel=m;}
    }
    if(doel&&!KLOKAAN){vx=doel.x-d.x;vy=doel.y-d.y;}
    else{vx=WERF.x-d.x;vy=WERF.y-d.y;
      if(vx*vx+vy*vy<180*180){vx=Math.cos(d.tred*.2);vy=Math.sin(d.tred*.2);}}
  }
  const l=Math.hypot(vx,vy)||1;
  const dox=d.x, doy=d.y;
  d.x+=vx/l*(d.spd||18)*dt;d.y+=vy/l*(d.spd||18)*dt;
  dwalerMuur(d,dox,doy,dt);            // 'n muur stop OOK 'n nes-zombie — anders loop hy deur palissades

  // SKRIK — presies die bestaande reël: die stoep is veilig, soldate skrik nie
  if(!d.weg)for(const m of MENSE){
    if(m.taak&&m.taak.tipe==='storm')continue;
    if(dist2(m.x,m.y,STOEP.x,STOEP.y)<70*70)continue;
    if(dist2(d.x,d.y,m.x,m.y)<95*95&&!muurTussen(d.x,d.y,m.x,m.y,false))m.vlug=Math.max(m.vlug||0,3);
  }

  /* DIE WERKLIKE SKADE. Hy vreet die spens — en dít loop reguit in die kos-yking
     en dus in die honger-venster en dus in die dryf-gewildheid in. Is daar niks
     te vreet nie, breek hy ’n bousite se aangedraagde vrag af. */
  if(!d.weg&&dist2(d.x,d.y,WERF.x,WERF.y)<240*240){
    d.binneT-=dt;d.stealT-=dt;
    if(d.stealT<=0){
      d.stealT=NES_STEEL;
      if(voorraad('kos')>0){
        /* Deur die GROOTBOEK, nie bykom() nie: 'n rou bykom('kos',-1) laat S.kos daal
           terwyl S.kosS staan, en die invariant kosSom()===S.kos breek by die eerste
           raid. Die harnas het dit gevang. */
        kosEet(1);spanne(d.x,d.y-14,5,'#c05038');klank(110,.2,.12);
        plToast('Iets vreet in die spens.');
      }else{
        const s=GEB.find(g=>!g.klaar&&g.gelewer>g.verbruik);
        if(s){s.gelewer--;if(s.gelewerH>0)s.gelewerH--;else if(s.gelewerK>0)s.gelewerK--;
          spanne(s.x,s.y,6,'#c05038');klank(100,.24,.12);plToast('Hulle breek die bouwerk af.');}
      }
    }
    if(d.binneT<=0)d.weg=true;            // versadig — hy dwaal terug
  }
  if(d.weg&&dist2(d.x,d.y,WERF.x,WERF.y)>1900*1900)d.dood=true;
}

/* ============================== DIE UITMARS ============================== */
function komGrootte(){return KOM_GROOTTES[clamp(S.komGr|0,0,KOM_GROOTTES.length-1)];}
function komKandidate(nes){
  const lys=MENSE.filter(m=>!(m.vlug>0)&&(m.wond||0)<NES_WONDBREEK&&
                            !(m.taak&&m.taak.tipe==='storm'));
  /* Werklose eerste, dan die naaste: so word ’n tuinier laaste gevat en die
     kos-ketting bly so lank moontlik heel. */
  lys.sort((a,b)=>((a.werkplek?1:0)-(b.werkplek?1:0))||
                  (dist2(a.x,a.y,nes.x,nes.y)-dist2(b.x,b.y,nes.x,nes.y)));
  return lys;
}
function stuurKommando(nes){
  if(!nes||nes.dood)return;
  if(KLOKAAN){plToast('Die klok lui — niemand gaan nou uit nie.');klank(150,.18,.1);return;}
  const min=KOM_GROOTTES[0];
  let n=komGrootte();
  const kand=komKandidate(nes);
  /* Die plaas bly NOOIT leeg nie: twee mense bly agter, anders staan die kos stil
     en die dorp verhonger terwyl die kommando weg is. */
  if(MENSE.length-n<2)n=MENSE.length-2;
  n=Math.min(n,kand.length,Math.floor(voorraad('hout')/KOM_FAKKEL));
  if(n<min){
    plToast(voorraad('hout')<min*KOM_FAKKEL?'Te min hout vir fakkels.'
                                           :'Te min mense om uit te marsjeer.');
    klank(150,.18,.1);return;
  }

  bykom('hout',-n*KOM_FAKKEL);
  for(let i=0;i<n;i++){
    const m=kand[i];
    if(m.dra)losVrag(m);
    /* Die ou taak word NET gelos — ’n vat-taak moet sy eis by die site terugtrek,
       anders glo die site vir ewig dat materiaal onderweg is. */
    if(m.taak&&m.taak.tipe==='vat'&&m.taak.site){
      const st=m.taak.site;st.opPad--;
      if(m.taak.soort==='hout')st.opPadH--;else st.opPadK--;
    }
    if(m.taak&&m.taak.tipe==='bou'&&m.taak.site)m.taak.site.bouer=null;
    if(m.taak&&m.taak.tipe==='kap'&&m.taak.boom)m.taak.boom.geëis=Math.max(0,m.taak.boom.geëis-1);
    const a=(i/n)*TAU;
    m.taak={tipe:'storm',nes,fase:0,gleuf:a,
            tx:nes.x+Math.cos(a)*44,ty:nes.y+Math.sin(a)*32};
    m.slaan=0;
  }
  klank(520,.16,.14);setTimeout(()=>klank(392,.24,.14),150);
  paSê('Vat fakkels. Ons stap na '+nes.naam+' toe.');
  plToast(n+' man marsjeer · '+(n*KOM_FAKKEL)+'🪵 fakkels');
  persistSoon();
}

/* ============================== DIE GELUK-RYE ==============================
   Neste SKRYF NOOIT aan S.geluk nie — hulle gee net rye vir dagDryf() se som,
   presies soos die rantsoen en die braai. */
function nesGelukRye(rye){
  let dreig=0,naby=0;
  for(const n of NESTE){
    const d=nesAfstand(n);
    if(d<760){dreig+=NES_BANDE[n.band].dreig-2*(n.vlak-1);naby++;}
    else if(d<1150){dreig+=Math.round((NES_BANDE[n.band].dreig-2*(n.vlak-1))/2);naby++;}
  }
  if(dreig<0)rye.push([naby+(naby===1?' nes broei naby':' neste broei naby'),Math.max(-8,dreig),'veiligheid']);
  else if(NESTE.length)rye.push(['Die naby veld is skoon',+2,'veiligheid']);
  else rye.push(['Geen nes bly oor nie',+4,'veiligheid']);
  const gew=MENSE.filter(m=>(m.wond||0)>0).length;
  if(gew>=2)rye.push([gew+' gewondes lê rond',-3,'gebeurtenis']);
  if(S.nesRoem>0)rye.push(['’n Nes uitgeroei',S.nesRoem,'gebeurtenis']);
  if(S.nesRou>0)rye.push(['Ons het mense verloor',-S.nesRou,'gebeurtenis']);
}
/* Word NA die dag se som geroep: die roem verbleik, die rou bedaar, en wonde
   genees een per dag — ’n gewonde man is ’n paar dae se swakker kommando. */
function nesDagRol(){
  S.nesRoem=Math.max(0,(S.nesRoem||0)-3);
  S.nesRou =Math.max(0,(S.nesRou ||0)-2);
  for(const m of MENSE)if(m.wond)m.wond--;
}

/* ============================== DIE KAART (UI) ============================== */
let nesKnA=null,nesKnB=null;
function nesKnoppe(aan){
  const kaart=document.getElementById('gebkaart');
  if(!nesKnA){
    nesKnA=document.createElement('button');nesKnA.className='kn';
    nesKnA.style.cssText='margin-top:8px;width:100%';
    nesKnA.onclick=()=>{if(NESKIES)stuurKommando(NESKIES);};
    kaart.appendChild(nesKnA);
    nesKnB=document.createElement('button');nesKnB.className='kn';
    nesKnB.style.cssText='margin-top:6px;width:100%';
    nesKnB.onclick=()=>{S.komGr=((S.komGr||0)+1)%KOM_GROOTTES.length;persistSoon();
                        if(NESKIES)kiesNes(NESKIES);};
    kaart.appendChild(nesKnB);
  }
  nesKnA.style.display=aan?'block':'none';
  nesKnB.style.display=aan?'block':'none';
  document.getElementById('gkOpg').style.display=aan?'none':'';
}
function nesOnder(wx,wy){
  let beste=null,bd=1e12;
  for(const n of NESTE){
    const hw=54,hh=44;                    // ruim raak-teiken: ’n vinger is nie ’n muis nie
    if(Math.abs(wx-n.x)<=hw&&Math.abs(wy-n.y)<=hh){
      const d=dist2(wx,wy,n.x,n.y);if(d<bd){bd=d;beste=n;}
    }
  }
  return beste;
}
function kiesNes(n){
  const kaart=document.getElementById('gebkaart');
  NESKIES=n;
  if(!n||n.dood){NESKIES=null;nesKnoppe(false);kaart.style.display='none';return;}
  GEKIES=null;
  document.getElementById('gkNaam').textContent='💀 NES · '+n.naam.toUpperCase();
  const maks=nesMaksHp(n), aanv=MENSE.filter(m=>m.taak&&m.taak.tipe==='storm'&&m.taak.nes===n).length;
  const rye=[['Vlak',n.vlak+'/'+NES_MAKSVLAK],
             ['Lewe',Math.ceil(n.hp)+'/'+maks],
             ['Afstand',Math.round(nesAfstand(n)/16)+' m'],
             ['Broei',Math.ceil(n.broeiT)+'s · '+nesLewendes(n)+'/'+NES_UIT[n.vlak-1]+' uit'],
             ['Buit',nesMunt(n)+'🪙 '+nesBuit(n).hout+'🪵 '+nesBuit(n).klip+'🪨']];
  if(n.vlak<NES_MAKSVLAK)
    rye.push(['Ryp oor',Math.ceil((NES_BANDE[n.band].rypDae*VOLLEDAG-n.ryp)/VOLLEDAG*10)/10+' dae']);
  const aanb=nesAanbeveel(n);
  rye.push(['Vat minstens',aanb+' man']);
  if(aanv)rye.push(['Aanvallers',aanv+' man']);
  if(nagAlpha()>0.35)rye.push(['Snags byt hy harder','⚠ wag vir lig']);
  document.getElementById('gkRye').innerHTML=
    rye.map(r=>'<div class="r"><span>'+r[0]+'</span><span class="'+
      (r[0]==='Buit'?'op':r[0]==='Vlak'||r[0]==='Aanvallers'?'':'af')+'">'+r[1]+'</span></div>').join('');
  nesKnoppe(true);
  const g=komGrootte();
  const min4=KOM_GROOTTES[0];
  nesKnA.innerHTML='⚔️ Marsjeer<small>'+g+' man · '+(g*KOM_FAKKEL)+'🪵 fakkels'+
    (g<aanb?' · te min':'')+'</small>';
  nesKnA.className='kn'+(g<aanb?' rooi':' groen');
  nesKnA.disabled=KLOKAAN||MENSE.length<min4+2||voorraad('hout')<min4*KOM_FAKKEL;
  nesKnB.innerHTML='👥 Kommando: '+g+'<small>tik om te wissel</small>';
  kaart.style.display='block';
}

/* ============================== DIE HUD ==============================
   Twee blokkies wat in JS gemaak word sodat die HTML/CSS onaangeraak bly. */
let hNeste=null,hMunt=null,hudOu='';
function nesHudBou(){
  if(hNeste)return;                               // idempotent: nesBegin() mag meer as een keer loop
  const hud=document.getElementById('hud'), voor=document.getElementById('dagwys');
  hNeste=document.createElement('div');hNeste.className='b';
  hNeste.style.cssText='pointer-events:auto;cursor:pointer';
  hNeste.innerHTML='💀 <b id="hNesN">0</b>';
  /* ’n Tik spring die kamera na die naaste nes: op ’n foon is dit die enigste
     bekostigbare manier om ’n dreigement 1500px ver te gaan kyk. */
  hNeste.onclick=()=>{
    let b=null,bd=1e12;
    for(const n of NESTE){const d=dist2(n.x,n.y,WERF.x,WERF.y);if(d<bd){bd=d;b=n;}}
    if(b){KAM.x=b.x;KAM.y=b.y;kamKlem();kiesNes(b);klank(420,.06,.08);}
  };
  hud.insertBefore(hNeste,voor);
}
function nesHud(){
  if(!hNeste)return;
  let naaste=1e9,erg=0;
  for(const n of NESTE){naaste=Math.min(naaste,nesAfstand(n));erg=Math.max(erg,n.vlak);}
  const t=NESTE.length+(NESTE.length?' · '+Math.round(naaste/16)+'m':'');
  if(t!==hudOu){
    hudOu=t;
    document.getElementById('hNesN').textContent=t;
    hNeste.style.borderColor=naaste<760?'#c05038':erg>=3?'#c08a38':'#5c4a2e';
  }
}

/* ============================== TEKEN ==============================
   Die nes moet op ’n uitgezoemde foon (z≈0.45) LEES. Daarom: ’n donker vorm met
   ’n harde buitelyn, ’n koue gloed wat pols, en ’n skedel-merker wat teen die
   zoem geskaal word sodat hy altyd omtrent ewe groot op die glas is. */
function tekenNes(n){
  const puls=0.5+0.5*Math.sin(n.puls*2.2);
  const naby=1-clamp(n.broeiT/nesBroeiT(n),0,1);      // hoe nader aan uitbroei, hoe warmer
  const sk=n.skud>0?Math.sin(n.skud*50)*3:0;
  const gr=44+8*n.vlak;
  ctx.save();ctx.translate(n.x+sk,n.y);

  // koue gloed — die dreigement wat jy sien voor jy die vorm sien
  const gl=ctx.createRadialGradient(0,-6,6,0,-6,gr*2.4);
  gl.addColorStop(0,'rgba(96,168,72,'+(0.16+0.14*puls+0.2*naby)+')');
  gl.addColorStop(1,'rgba(96,168,72,0)');
  ctx.fillStyle=gl;ctx.beginPath();ctx.arc(0,-6,gr*2.4,0,TAU);ctx.fill();

  // dreig-kring: waarbinne hy jou mense aanvat
  ctx.strokeStyle='rgba(192,80,56,'+(0.20+0.16*puls)+')';ctx.lineWidth=2;
  ctx.setLineDash([9,8]);ctx.beginPath();ctx.ellipse(0,0,gr*2.1,gr*1.35,0,0,TAU);ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle='rgba(10,14,7,.4)';
  ctx.beginPath();ctx.ellipse(4,7,gr*.95,gr*.36,0,0,TAU);ctx.fill();
  // die hoop self
  ctx.fillStyle='#2b2a1c';
  ctx.beginPath();ctx.ellipse(0,0,gr*.86,gr*.5,0,0,TAU);ctx.fill();
  ctx.fillStyle='#3d3a24';
  ctx.beginPath();ctx.ellipse(-4,-5,gr*.66,gr*.36,0,0,TAU);ctx.fill();
  ctx.strokeStyle='#14180e';ctx.lineWidth=3;
  ctx.beginPath();ctx.ellipse(0,0,gr*.86,gr*.5,0,0,TAU);ctx.stroke();
  // die keel
  ctx.fillStyle='#0b1207';
  ctx.beginPath();ctx.ellipse(-2,-6,gr*.3,gr*.17,0,0,TAU);ctx.fill();
  ctx.fillStyle='rgba(126,201,94,'+(0.35+0.4*naby)+')';
  ctx.beginPath();ctx.ellipse(-2,-6,gr*.3*(0.4+0.3*puls),gr*.17*(0.4+0.3*puls),0,0,TAU);ctx.fill();
  // doringpale — tel hulle en jy weet die vlak
  const pale=3+n.vlak*2;
  for(let i=0;i<pale;i++){
    const a=(i/pale)*TAU+n.ni*0.7;
    const px=Math.cos(a)*gr*.72, py=Math.sin(a)*gr*.42;
    const hh=12+((i*7+n.ni*3)%9)+n.vlak*4;
    ctx.strokeStyle='#c9c0aa';ctx.lineWidth=3.2;
    ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+(px>0?4:-4),py-hh);ctx.stroke();
    ctx.strokeStyle='#14180e';ctx.lineWidth=1.2;
    ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+(px>0?4:-4),py-hh);ctx.stroke();
  }
  // lewe-balk sodra hy geslaan is
  const maks=nesMaksHp(n);
  if(n.hp<maks-0.5){
    ctx.fillStyle='rgba(10,14,7,.8)';ctx.fillRect(-gr*.8,-gr*.86,gr*1.6,7);
    ctx.fillStyle='#c05038';ctx.fillRect(-gr*.8+1,-gr*.86+1,(gr*1.6-2)*clamp(n.hp/maks,0,1),5);
  }
  ctx.restore();

  /* Skerm-vaste merker: skaal 1/z sodat hy by z=0.45 nie ’n stippel is nie. */
  const s=1/KAM.z;
  ctx.save();ctx.translate(n.x,n.y-gr*.9-16*s);ctx.scale(s,s);
  ctx.font='19px VT323,monospace';ctx.textAlign='center';
  const naam=n.naam+' · v'+n.vlak;
  const w=ctx.measureText(naam).width+14;
  ctx.fillStyle='rgba(10,14,7,.85)';ctx.fillRect(-w/2,-16,w,20);
  ctx.strokeStyle=NESKIES===n?'#e0b64f':'#7a3427';ctx.lineWidth=2;ctx.strokeRect(-w/2,-16,w,20);
  ctx.fillStyle='#d8b0a0';ctx.fillText(naam,0,0);
  ctx.fillStyle='#c05038';ctx.font='17px VT323,monospace';
  ctx.fillText('💀',0,-20);
  ctx.restore();

  if(NESKIES===n){
    const z=Math.max(KAM.z,.05);
    ctx.strokeStyle='#e8c96a';ctx.lineWidth=2.6/z;ctx.setLineDash([7/z,5/z]);
    ctx.strokeRect(n.x-gr,n.y-gr*.7,gr*2,gr*1.4);ctx.setLineDash([]);
  }
}

/* SKERMRAND-WYSERS. Dít is die kenmerk se hart op ’n foon: die kamera staan op
   die werf, die neste is 900-1700px ver, en sonder ’n wyser bestaan hulle nie
   vir die speler nie. Die pyl wys die rigting, die getal die afstand, en die
   kleur die erns. Word in SKERM-ruimte geteken (na ctx.restore()). */
function nesWysers(){
  const mrgX=26, mrgB=150, mrgT=84;
  ctx.save();
  ctx.font='16px VT323,monospace';ctx.textAlign='center';ctx.textBaseline='middle';
  for(const n of NESTE){
    const sx=(n.x-KAM.x)*KAM.z+VW/2, sy=(n.y-KAM.y)*KAM.z+VH/2;
    if(sx>mrgX&&sx<VW-mrgX&&sy>mrgT&&sy<VH-mrgB)continue;      // hy is sigbaar
    const cx=VW/2, cy=(mrgT+VH-mrgB)/2;
    let dx=sx-cx, dy=sy-cy;
    const hw=VW/2-mrgX, hh=(VH-mrgB-mrgT)/2;
    const t=Math.min(hw/(Math.abs(dx)||1e-6),hh/(Math.abs(dy)||1e-6));
    const px=cx+dx*t, py=cy+dy*t, hoek=Math.atan2(dy,dx);
    const d=nesAfstand(n);
    const kl=d<760?'#c05038':n.vlak>=3?'#c08a38':'#9aa07f';
    const puls=0.6+0.4*Math.sin(n.puls*2.2);
    ctx.save();ctx.translate(px,py);
    ctx.globalAlpha=d<760?1:0.82;
    ctx.rotate(hoek);
    ctx.fillStyle=kl;
    ctx.beginPath();ctx.moveTo(13,0);ctx.lineTo(-6,-9);ctx.lineTo(-6,9);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#14180e';ctx.lineWidth=2;ctx.stroke();
    ctx.restore();
    // die plaatjie sit ná binne, sodat hy nie oor die rand hang nie
    const lx=clamp(px-Math.cos(hoek)*30,44,VW-44), ly=clamp(py-Math.sin(hoek)*30,mrgT+14,VH-mrgB-14);
    const teks='💀'+Math.round(d/16)+'m';
    const w=ctx.measureText(teks).width+12;
    ctx.globalAlpha=d<760?0.95:0.75;
    ctx.fillStyle='rgba(10,14,7,.88)';ctx.fillRect(lx-w/2,ly-11,w,22);
    ctx.strokeStyle=kl;ctx.lineWidth=d<760?2.4*puls+0.8:1.8;ctx.strokeRect(lx-w/2,ly-11,w,22);
    ctx.fillStyle=kl;ctx.fillText(teks,lx,ly+1);
    ctx.globalAlpha=1;
  }
  ctx.textBaseline='alphabetic';
  ctx.restore();
}

/* ============================== BEGIN / STOOR ============================== */
function nesRy(n){return [Math.round(n.x),Math.round(n.y),n.band,n.vlak,Math.round(n.hp),
                          Math.round(n.ryp),n.ni,Math.round(n.broeiT),n.gesien?1:0];}
function nesBegin(){
  if(S.komGr===undefined)S.komGr=0;
  if(S.nesRoem===undefined)S.nesRoem=0;
  if(S.nesRou===undefined)S.nesRou=0;
  nesSaaiT=4*VOLLEDAG;
  if(S.neste&&S.neste.length){
    for(const r of S.neste){
      const [x,y,band,vlak,hp,ryp,ni,broeiT,gesien]=r;
      if(!NES_BANDE[band])continue;
      const n=nuweNes(x,y,band,ni||0);
      n.vlak=clamp(vlak||1,1,NES_MAKSVLAK);
      n.hp=Math.min(hp||nesMaksHp(n),nesMaksHp(n));
      n.ryp=ryp||0;n.broeiT=broeiT||NES_BANDE[band].broei;n.gesien=gesien||0;
      NESTE.push(n);
      nesNaamI=Math.max(nesNaamI,(ni||0)+1);
    }
  }
  if(!NESTE.length)saaiNeste();
  nesHudBou();nesHud();
}

/* ---- NESTE deur die REGISTERS ---- */
const T_NES=verwerId(tekenNes);             // eie verwer-nommer; nooit 'n hardgekodeerde 6
GLBRONNE.push(rye=>nesGelukRye(rye));       // dreiging/roem/rou as rye, met kategorieë

/* ============================== BEGIN ============================== */
bakTerrein();kamBegin();
// herstel gestoorde geboue
for(const rec of (S.geb||[])){
  /* Lees ALBEI vorms: die ou posisionele skikking EN die nuwe benoemde rekord. 'n Speler
     wat vanoggend gespeel het, moet vanaand nog sy plaas he. */
  const o=Array.isArray(rec)
    ? {t:rec[0],x:rec[1],y:rec[2],k:rec[3],st:rec[4],gl:rec[5],vb:rec[6],
       vlak:rec[7],opg:rec[8],glH:rec[9],glK:rec[10]}
    : (rec||{});
  const tipe=o.t;
  if(!GT[tipe])continue;
  const g=nuweGebou(tipe,o.x,o.y);
  g.klaar=!!o.k;g.stadium=o.st||0;g.gelewer=o.gl||0;g.verbruik=o.vb||0;
  g.vlak=Math.min(o.vlak||1,maxVlak(tipe));    // klem, ingeval 'n tabel later krimp
  g.opgradeer=o.opg||0;
  g.gelewerH=o.glH||0;g.gelewerK=o.glK||0;
  for(const f of GEBLAAI)f(g,o);               // kenmerke lees hul eie sleutels terug
  GEB.push(g);
}
// die mense
{
  const n=Math.max(6,Math.min(24,S.mense||6));
  for(let i=0;i<n;i++)MENSE.push(maakMens(WERF.x+rand(-130,130),WERF.y+rand(-40,150)));
}
// begin-toneel: twee gemerkte bome sodat die eerste val binne ~15s kom, plus los planke
if(!S.geb||!S.geb.length){
  let n=0;
  for(const b of BOME){
    if(n>=2)break;
    if(dist2(b.x,b.y,WERF.x,WERF.y)<480*480){b.gemerk=true;b.hp=4;n++;}
  }
  for(let i=0;i<5;i++)VRAGTE.push({x:1520+rand(-30,220),y:1230+rand(0,60),soort:'hout',geëis:0});
}
nesBegin();
broerLaai();
bemanGeboue();bouBalk();spanBalk();
herstelKrygsmag();
requestAnimationFrame(raam);
</script>
