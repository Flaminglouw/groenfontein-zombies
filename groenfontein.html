function tekenSpanMerke(){
  for(const m of SPAN){
    if(!m.staan)continue;
    ctx.strokeStyle='rgba(232,201,106,.7)';ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(m.staan.x-5,m.staan.y-3);ctx.lineTo(m.staan.x+5,m.staan.y+3);
    ctx.moveTo(m.staan.x+5,m.staan.y-3);ctx.lineTo(m.staan.x-5,m.staan.y+3);
    ctx.stroke();
  }
  if(BEVELMERK.t>0){
    const f=1-BEVELMERK.t/1.1, rr=10+f*34;
    ctx.strokeStyle='rgba(232,201,106,'+(1-f).toFixed(2)+')';ctx.lineWidth=3;
    ctx.beginPath();ctx.ellipse(BEVELMERK.x,BEVELMERK.y,rr,rr*.55,0,0,TAU);ctx.stroke();
  }
}

let laasTikT=0,laasTikX=0,laasTikY=0;
function merkTik(wx,wy){                     // die bestaande merk-gedrag, net uitgelig
  let beste=null,bd=46*46;
  for(const b of BOME){
    if(b.toestand!=='staan')continue;
    const d=dist2(wx,wy,b.x,b.y-10);
    if(d<bd){bd=d;beste=b;}
  }
  if(beste){beste.gemerk=!beste.gemerk;klank(beste.gemerk?520:260,.05,.09);}
}

function tik(wx,wy){
  document.getElementById('glkaart').style.display='none';
  document.getElementById('belkaart').style.display='none';
  if(PLAAS&&GT[PLAAS].muur){muurKlik(wx,wy);return;}   // muur: tik begin, dan einde
  if(PLAAS){SPOOK.x=wx;SPOOK.y=wy;return;}          // plasing: tik verskuif die spook
  if(dist2(wx,wy,KLOKPAAL.x+7,KLOKPAAL.y+14)<52*52){luiKlok();bouBalk();spanBalk();return;}
  if(broerRaak(wx,wy))return;                      // held kies / held stuur
  if(MODUS==='rally'){                       // uitdruklike modus wen, soos merk en plasing
    S.rally={x:Math.round(wx),y:Math.round(wy)};
    MODUS=null;wysPrompt(null);bouBalk();persistSoon();
    klank(560,.08,.1);spanne(wx,wy,8,'#c05038');plToast('Versamelpunt gestel.');
    return;
  }
  {
    const sk=skathuisPlek();
    if(sk&&Math.abs(wx-sk.x)<GT.skathuis.w/2+14&&Math.abs(wy-sk.y)<GT.skathuis.h/2+14){
      wysBelkaart(true);return;
    }
  }
  if(MODUS!=='merk'){
    const n=nesOnder(wx,wy);                   // neste staan ver van geboue af
    if(n){kiesNes(n);klank(300,.06,.08);return;}
    /* SPAN: tik 'n mens = KIES hom (dubbeltik = sy hele soort); met 'n span in die hand is
       elke ander tik 'n BEVEL (gebou / boom / grond). Mens VOOR span: "tik 'n mens = kies hom"
       moet een reël bly. */
    const nou=performance.now();
    const dubbel=(nou-laasTikT<340)&&dist2(wx,wy,laasTikX,laasTikY)<30*30;
    laasTikT=nou;laasTikX=wx;laasTikY=wy;
    const mm=mensOnder(wx,wy);
    if(mm){if(dubbel)kiesSoort(mm);else kiesEen(mm);return;}
    if(SPAN.size){bevelTik(wx,wy);return;}
    const g=gebOnder(wx,wy);
    kiesGebou(g);                                    // null sluit die paneel
    if(g){klank(400,.05,.07);return;}
  }
  if(MODUS==='merk')merkTik(wx,wy);
}


/* ============================== OPDATEER ============================== */
let T=0, swerwerT=0, dwalerT=70, kosKlok=0, swerwerModus=0, hongerTel=0, hongerVorige=0;
let METE=false,mTye=[];
function update(dt){
  randRol(dt);                 // kamera eerste — alles hierna sien reeds die nuwe uitsig
  T+=dt;S.tyd+=dt;
  const nuweDag=1+Math.floor(S.tyd/VOLLEDAG);
  if(nuweDag!==S.dag){S.dag=nuweDag;dagDryf();persistSoon();}
  const tvd=S.tyd%VOLLEDAG;
  // braai steek aan teen skemer
  const br=braaiPlek();
  const wilBrand=br&&tvd>DAGLENGTE-24;
  if(wilBrand&&!BRAAI_AAN){BRAAI_AAN=true;klank(180,.3,.14);paSê('Vuur is aan.');}
  if(!wilBrand&&BRAAI_AAN)BRAAI_AAN=false;

  mureTik(dt);                     // die muur-indeks moet VARS wees voor mensTik loop
  for(const m of MENSE)mensTik(m,dt);
  krygsmagTik(dt);   // kasernes, oefentou, eenhede
  nesteTik(dt);      // ryping, broei, geveg
  broerOpdateer(dt); // die broers loop, veg, val en staan weer op
  gelukFaktore();                  // hou die kaart vars; die DRYF gebeur per dag

  /* DIE KOS-KLOK — 'n akkumulator wat EEN eenheid op 'n slag laat val, sodat die
     spens sigbaar leegloop (Stronghold se model).
     DIE YKING: een tuinier lewer ±16 kos per dag; teen drempel 60 eet 'n mens 4 per
     dag, dus voed EEN tuinier VIER monde op Normaal. Dit maak kos die werklike
     beperking — en eers dan beteken die hefboom iets: op Dubbel voed hy net twee. */
  {
    /* Die TEMPO volg die speler se keuse, nie die rak nie. Het ons hier
       RANTSOEN[leë spens ? 0 : ...] gebruik, sou 'n leë spens die klok heeltemal
       stop en dan tel geen enkele gemiste maaltyd nie — die dorp verhonger stil-stil
       terwyl die humeur klim. Kies die speler self 'Geen', staan die klok wel — die
       -8 kom dan reeds uit die rantsoen-ry. */
    const r=RANTSOEN[S.rant];
    const mnd=monde();
    if(r.mult>0&&mnd){
      kosKlok+=dt*mnd*r.mult;
      if(kosKlok>=60){
        kosKlok-=60;                 // trek af, moenie nulstel nie — anders gaan die res verlore
        if(voorraad('kos')>0){kosEet(1);
          const m=MENSE[(R()*MENSE.length)|0];
          if(m)spanne(m.x,m.y-16,2,'#7fc95e');}
        else hongerTel++;              // 'n maaltyd wat NIE gebeur het nie
      }
    }
  }

  /* DIE GOUD-KLOK — dieselfde akkumulator-vorm as die kos-klok, sodat die twee
     hefbome dieselfde ritme deel en 'n leser wat een verstaan, die ander gratis
     kry. Ons wissel op belVlak(), nie op belKeuse(), sodat 'n leë kis op
     Geskenk stil staan in plaas daarvan om skuld op te bou. */
  {
    const sk=skathuisPlek(), b=belVlak();
    if(sk&&MENSE.length&&b.tarief!==0){
      goudKlok+=dt*MENSE.length*b.tarief;
      while(goudKlok>=GOUDDREMPEL){          // belasting IN
        goudKlok-=GOUDDREMPEL;
        const m=MENSE[(R()*MENSE.length)|0];
        muntVlieg(m?m.x:sk.x, m?m.y-18:sk.y, sk.x, sk.y-10, +1);
      }
      while(goudKlok<=-GOUDDREMPEL){         // geskenk UIT
        goudKlok+=GOUDDREMPEL;
        if((S.goud||0)>0){
          goudBy(-1);                        // reserveer by vertrek, nie by aankoms nie
          const m=MENSE[(R()*MENSE.length)|0];
          muntVlieg(sk.x, sk.y-10, m?m.x:sk.x, m?m.y-18:sk.y, -1);
        }else{goudKlok=0;break;}
      }
    }else goudKlok=0;                        // geen skathuis / geen belasting: geen skuld
  }
  /* Munte in die lug. Die telling skuif hier — by die LANDING, nie by die vra nie. */
  for(let i=MUNTVLUG.length-1;i>=0;i--){
    const c=MUNTVLUG[i];c.t+=dt;
    if(c.t>=c.dur){
      if(c.rig>0){goudBy(1);spanne(c.x1,c.y1,4,'#e0b64f');klank(1180,.07,.09);}
      else spanne(c.x1,c.y1,3,'#e0b64f');
      MUNTVLUG.splice(i,1);
    }
  }

  /* AANKOMS EN VERTREK op Stone Kingdoms se gepubliseerde kurwe (Apache-2.0,
     met dank): sekondes per mens = 51 x mod, stadigste naby 50 — 'n natuurlike
     dooie band, sodat 'n dorp op die drempel nie flikker nie. */
  const bed=beddens();
  const p=S.geluk;
  /* Een horlosie, twee rigtings — maar 'n wissel moet die horlosie herstel, anders
     stap iemand op die presiese oomblik weg wat die humeur dip. */
  /* DIE HEK IS OP VLOEI, NIE OP DIE RAK NIE. Gemeet met die ou rak-hek: by geluk 100
     kom daar 38 mense in EEN dag (6 -> 44). Die tussenpose is 51*km en km val van 0.73
     by geluk 50 na 0.09 by 100 — dus een mens elke 4.6s. Hulle het 176 kos/dag nodig
     terwyl een tuinier 16 lewer. 'n Vol spens sê niks oor of jy hulle MORE kan voed nie;
     die produksie-vloei sê dit wel. Plus 'n vloer van 22s op die tussenpose, sodat die
     vinnigste tempo nog steeds 'n dorp is en nie 'n stortvloed nie. */
  const mnd=monde();
  const kanVoed=kosVloei()>=mnd*4 && voorraad('kos')>=6+mnd*0.5;
  const mod=(p>=50&&MENSE.length<bed&&kanVoed)?1:(p<40&&MENSE.length>3)?-1:0;
  if(mod!==swerwerModus){swerwerModus=mod;swerwerT=mod?18:0;}
  if(p>=50&&MENSE.length<bed&&kanVoed&&!KLOKAAN){
    const km=0.08*Math.pow((100-p)/25,3)+0.09;
    swerwerT-=dt;
    if(swerwerT<=0){
      swerwerT=Math.max(22,51*km);      // vloer: nooit vinniger as een mens per 22s

      const m=maakMens(1760,WH-60);
      m.taak={tipe:'stap',tx:WERF.x+rand(-70,70),ty:WERF.y+rand(60,160)};
      MENSE.push(m);kosEet(2);
      plToast(m.naam+' het by die plaas aangekom.');
      klank(560,.12,.1);bemanGeboue();persistSoon();
    }
  }else if(p<40&&MENSE.length>3&&!KLOKAAN){
    const km=0.08*p*p/500+0.1;
    swerwerT-=dt;
    if(swerwerT<=0){
      swerwerT=51*km;
      // die nuutste eerste — hy het die minste hier belê
      const m=MENSE[MENSE.length-1];
      if(m.werkplek){const i=m.werkplek.werkers.indexOf(m);if(i>=0)m.werkplek.werkers.splice(i,1);}
      SPAN.delete(m);m.staan=null;spanBalk();   // 'n vertrekker val uit die seleksie
      MENSE.pop();
      plToast(m.naam+' het die plaas verlaat.');
      klank(180,.3,.12);bemanGeboue();persistSoon();
    }
  }else swerwerT=Math.min(swerwerT,25);

  // bome
  for(const b of BOME){
    if(b.skud>0)b.skud-=dt;
    if(b.toestand==='val'){
      b.valT+=dt;
      if(b.valT>=1.2){
        b.toestand='weg';spanne(b.x,b.y,14,'#c2a25f');klank(70,.25,.2);
        for(let i=0;i<3;i++)VRAGTE.push({x:b.x+rand(-26,26)+b.valHoek*30,
          y:b.y+rand(-8,22),soort:'hout',geëis:0});
      }
    }
  }
  // dwalers
  if(T>55&&!S.g3&&DWALERS.length===0&&dwalerT>0){dwalerT=0;maakDwaler();
    wysPrompt('’n Dwaler. Tik die klok — almal hardloop skuiling toe.');}
  dwalerT-=dt;
  /* Die los dwaler was die plekhouer-bedreiging. Die neste is nou die bron. */
  if(dwalerT<=0&&DWALERS.length<2&&T>120&&!NESTE.length){dwalerT=95+R()*70;maakDwaler();}
  for(const d of DWALERS){
    if(dwalerVeg(d,dt))continue;   // veg of knaag hy aan 'n broer? dan is hy klaar hanteer
    if(d.eie){nesDwalerTik(d,dt);continue;}   // nes-zombies loop hul eie roete
    d.tred+=dt*4.6;
    let doel=null,bd=1e12;
    for(const m of MENSE){const q=dist2(d.x,d.y,m.x,m.y);if(q<bd){bd=q;doel=m;}}
    // 'n wagtoring hou hulle weg
    let bang=false;
    for(const g of GEB)if(g.klaar&&GT[g.tipe].lig&&dist2(d.x,d.y,g.x,g.y)<300*300){bang=true;break;}
    if(KLOKAAN||bang||bd>560*560)d.leiband+=dt;else d.leiband=0;
    /* HARDE JAAG-PERK. Sonder dit volg 'n dwaler die vlugtendes tot by die stoep,
       staan daar, en hernu hul skrik elke raam — een dwaler vries die hele dorp
       vir ewig (gemeet: twee draers 440s lank op vlug=3 vasgevang). Hy is 'n
       DWALER, nie 'n jagter nie: ná 13s verloor hy belangstelling en dwaal weg. */
    d.jaag=(doel&&!KLOKAAN&&!bang&&bd<560*560)?d.jaag+dt:0;
    if(d.jaag>13){d.weg=true;}
    if(d.leiband>9)d.weg=true;
    let vx,vy;
    if(d.weg||bang){vx=d.x-WERF.x;vy=d.y-WERF.y;}
    else if(doel&&!KLOKAAN&&d.jaag<=13){vx=doel.x-d.x;vy=doel.y-d.y;}
    else{vx=Math.cos(d.tred*.2);vy=Math.sin(d.tred*.2);}
    const l=Math.hypot(vx,vy)||1;
    const dox=d.x, doy=d.y;
    d.x+=vx/l*16*dt;d.y+=vy/l*16*dt;
    dwalerMuur(d,dox,doy,dt);      // 'n muur stop hom — en dan begin hy kap
    /* Die stoep is VEILIG: 'n mens wat klaar geskuil het, se skrik word nie
       hernu nie — anders is skuiling geen ontsnapping nie. */
    if(!KLOKAAN&&!d.weg)for(const m of MENSE){
      if(dist2(m.x,m.y,STOEP.x,STOEP.y)<70*70)continue;
      /* 'n Muur tussen hulle is WERKLIKE skuiling: die skrik dra nie deur klip nie. */
      if(dist2(d.x,d.y,m.x,m.y)<95*95&&!muurTussen(d.x,d.y,m.x,m.y,false))
        m.vlug=Math.max(m.vlug||0,3);
    }
    if(d.weg&&dist2(d.x,d.y,WERF.x,WERF.y)>1300*1300)d.dood=true;
  }
  for(let i=DWALERS.length-1;i>=0;i--)if(DWALERS[i].dood)DWALERS.splice(i,1);
  // regie
  if(!S.g1&&T>13&&GEB.length===0)
    wysPrompt('Twee slaap buite. Kies ⛺ Skerm hieronder en bou hom.');
  // klok, Pa, ambient
  if(klokSwaai>0)klokSwaai-=dt;
  PA.steam+=dt;
  if(PA.lynT>0)PA.lynT-=dt;
  else{PA.wagT-=dt;if(PA.wagT<=0){PA.wagT=16+R()*14;paSê(PA_LYNE[(R()*PA_LYNE.length)|0]);}}
  for(const h of HOENDERS){
    h.stapT-=dt;h.pik+=dt*5;
    if(h.stapT<=0){h.stapT=1.5+R()*2.5;const a=R()*TAU;
      h.vx=Math.cos(a)*14;h.vy=Math.sin(a)*10;if(R()<.4){h.vx=0;h.vy=0;}}
    h.x=clamp(h.x+h.vx*dt,WERF.x-220,WERF.x+140);
    h.y=clamp(h.y+h.vy*dt,WERF.y+20,WERF.y+190);
  }
  if(ROOK.length<10&&R()<dt*2.2)ROOK.push({x:1585+rand(-3,3),y:1058,t:0,life:2.6+R()});
  if(BRAAI_AAN&&br&&ROOK.length<18&&R()<dt*3)ROOK.push({x:br.x+rand(-3,3),y:br.y-14,t:0,life:2+R()});
  for(const r of ROOK){r.t+=dt;r.x+=Math.sin(r.t*2+r.life)*6*dt;r.y-=14*dt;}
  for(let i=ROOK.length-1;i>=0;i--)if(ROOK[i].t>=ROOK[i].life)ROOK.splice(i,1);
  for(const p of SPANNE){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=40*dt;}
  for(let i=SPANNE.length-1;i>=0;i--)if(SPANNE[i].t>=SPANNE[i].life)SPANNE.splice(i,1);
  for(const k of KRAAIE)k.a+=dt*.35;
  for(const m of MENSE)if(m.sê>0)m.sê-=dt;
  if(toastT>0)toastT-=dt;
  if(BEVELMERK.t>0)BEVELMERK.t-=dt;
  if(persistT>0){persistT-=dt;if(persistT<=0)persist();}
  // HUD
  document.getElementById('hHout').textContent=voorraad('hout');
  document.getElementById('hKlip').textContent=voorraad('klip');
  document.getElementById('hKos').textContent=voorraad('kos');
  {
    /* Die goud-blokkie verskyn eers saam met die skathuis. Voor dit is dit 'n
       nul wat niks beteken nie, en die HUD is foon-eerste — elke blokkie moet
       sy plek verdien. */
    const gb=document.getElementById('hGoudB');
    gb.style.display=skathuisPlek()?'block':'none';
    document.getElementById('hGoud').textContent=S.goud||0;
  }
  {const st=kosSoorteOpTafel(), e=document.getElementById('hSoorte');
   /* Die strokie is die enigste plek waar die speler die soorte SIEN sonder om
      die humeur-kaart oop te maak — daarom die dowwe kleur by een soort. */
   e.textContent=st.length?st.map(k=>KOSSOORT[k].ikoon).join(''):'—';
   e.style.opacity=st.length>=2?'1':'.5';}
  document.getElementById('hPop').textContent=MENSE.length;
  document.getElementById('hBed').textContent='/'+bed;
  document.getElementById('hGl').textContent=S.geluk;
  document.getElementById('hGeluk').firstChild.textContent=
    (S.geluk>=70?'😀 ':S.geluk>=55?'🙂 ':S.geluk>=40?'😐 ':'☹️ ');
  document.getElementById('dagwys').textContent='Dag '+S.dag+(nagAlpha()>.3?' · nag':'');
}

/* ============================== TEKEN ============================== */
/* ============================================================================
   MURE, HEKKE EN BRESSE
   ============================================================================
   HOEKOM 'n aparte stelsel bo-op GEB, en nie 'n nuwe lys nie: die vragte-ketting
   (vat -> bou -> stadiums) is die siel van die spel. 'n Muur wat NIE aangedra
   word nie, is nie 'n muur nie — hy's 'n knoppie. Elke muursegment bly dus 'n
   gewone gebou in GEB; ons voeg net 'n 40x40 ROOSTER-INDEKS by sodat 'n segment
   sy bure in O(1) kan lees. Dit gee ons hoeke, T-stukke en 'n vloei-vrye
   blokkeringstoets sonder 'n enkele nuwe wêreldlys.

   Die brug na die zombie-kant: 'n muur is HARD vir 'n dwaler (hy kap hom stukkend)
   en SAG vir 'n mens (hy stap deur die hekhuis). Dieselfde rooster antwoord albei
   vrae; net die `virMens`-vlag verskil.
   ============================================================================ */
const MUURGRID=40;                 // een segment = een sel
const MUUR_MAKS=14;                // hoogstens 14 selle per ✓ BOU — 'n hanteerbare hap
const MUUR_N=1, MUUR_O=2, MUUR_S=4, MUUR_W=8;
const MUUR={kaart:new Map(), n:-1, omring:false, omringT:0, begin:null, klimSê:false};

function gsleutel(gx,gy){return (gx<<12)|gy;}          // gy<4096, gx<4096: botsingsvry
function gxVan(x){return Math.floor(x/MUURGRID);}
function gyVan(y){return Math.floor(y/MUURGRID);}
function selMidX(gx){return gx*MUURGRID+MUURGRID/2;}
function selMidY(gy){return gy*MUURGRID+MUURGRID/2;}
function isMuurT(t){return !!(GT[t]&&GT[t].muur);}

/* Die indeks word herbou wanneer GEB van grootte verander — goedkoop (een lus oor
   die geboue) en dit spaar ons om elke push-plek in die kode te moet onthou. */
function muurIndeks(){
  MUUR.kaart.clear();
  for(const g of GEB){
    if(!isMuurT(g.tipe))continue;
    MUUR.kaart.set(gsleutel(gxVan(g.x),gyVan(g.y)),g);
  }
  MUUR.n=GEB.length; MUUR.omringT=0;
}
function muurSel(gx,gy){return MUUR.kaart.get(gsleutel(gx,gy))||null;}
/* Solied = klaar gebou. 'n Halfgeboude muur laat almal deur; anders sluit 'n
   bouspan homself uit by sy eie bousite. Die hek is solied vir zombies, oop
   vir mense — dit is die hele punt van die hekhuis. */
function muurSolied(gx,gy,virMens){
  const g=MUUR.kaart.get(gsleutel(gx,gy));
  if(!g||!g.klaar)return null;
  if(virMens&&GT[g.tipe].hek)return null;
  return g;
}
function muurPunt(x,y,virMens){return muurSolied(gxVan(x),gyVan(y),virMens);}
function muurBure(g){
  const gx=gxVan(g.x),gy=gyVan(g.y);let b=0;
  if(muurSel(gx,gy-1))b|=MUUR_N;
  if(muurSel(gx+1,gy))b|=MUUR_O;
  if(muurSel(gx,gy+1))b|=MUUR_S;
  if(muurSel(gx-1,gy))b|=MUUR_W;
  return b;
}
function muurTal(){let n=0;for(const g of MUUR.kaart.values())if(g.klaar)n++;return n;}

/* Loop 'n reguit lyn deur 'n solied sel? Ons monster elke 14px — fyner as die
   helfte van 'n sel, dus kan geen segment tussenin wegglip nie. */
function muurTussen(x1,y1,x2,y2,virMens){
  const dx=x2-x1,dy=y2-y1,d=Math.hypot(dx,dy);
  if(d<1)return null;
  const n=Math.min(72,Math.ceil(d/14));
  for(let i=1;i<=n;i++){
    const t=i/n;
    const g=muurPunt(x1+dx*t,y1+dy*t,virMens);
    if(g)return g;
  }
  return null;
}

/* ---------- IS DIE WERF OMRING? ----------
   Vloedvul vanaf die werf oor die rooster. Bereik ons die kaartrand, is daar 'n
   gat. Dit is die goedkoop weergawe van 'n vloeiveld: ons vra nie WAAR die pad
   loop nie, net OF een bestaan. 80x60 selle, een keer per sekonde. */
const MGW=Math.ceil(WW/MUURGRID), MGH=Math.ceil(WH/MUURGRID);
const _mvlag=new Uint8Array(MGW*MGH), _mry=new Int32Array(MGW*MGH);
function muurOmring(){
  if(muurTal()<8)return false;                    // te min mure om enigiets te sluit
  const sx=gxVan(WERF.x), sy=gyVan(WERF.y);
  if(muurSolied(sx,sy,false))return false;
  _mvlag.fill(0);
  let kop=0,stert=0;
  const s=sx+sy*MGW; _mvlag[s]=1; _mry[stert++]=s;
  while(kop<stert){
    const i=_mry[kop++], gx=i%MGW, gy=(i/MGW)|0;
    if(gx<=0||gy<=0||gx>=MGW-1||gy>=MGH-1)return false;   // die buitewêreld bereik
    for(let d=0;d<4;d++){
      const nx=gx+(d===1?1:d===3?-1:0), ny=gy+(d===0?-1:d===2?1:0);
      const j=nx+ny*MGW;
      if(_mvlag[j])continue;
      _mvlag[j]=1;
      if(!muurSolied(nx,ny,false))_mry[stert++]=j;
    }
  }
  return true;
}

/* ---------- SKADE EN BRESSE ---------- */
function muurHpMaks(g){return GT[g.tipe].hp||90;}
function muurSkade(g,n){
  if(!g||!g.klaar)return;
  const mx=muurHpMaks(g);
  g.hp=(g.hp===undefined?mx:g.hp)-n;
  g.skudT=.20;
  spanne(g.x+rand(-13,13),g.y-10,2,GT[g.tipe].klipMuur?'#9aa0a2':'#c9b06a');
  klank(115+R()*35,.06,.085);
  if(g.hp<=0)muurBreek(g);
}
/* 'n Bres is NIE 'n verwyderde gebou nie — dis 'n BOUSITE. Dieselfde mense loop
   dieselfde vragte aan om hom toe te maak. Ons los een stadium se werk staan
   sodat 'n gat vinnig gestop kan word, maar nooit gratis nie. */
function muurBreek(g){
  const k=GT[g.tipe].koste;
  g.klaar=false; g.wasKlaar=false; g.hp=0;
  g.stadium=1; g.verbruik=1;
  g.gelewer=Math.min(1,stKoste(g.tipe));
  g.gelewerH=Math.min(1,k.hout||0);
  g.gelewerK=(k.hout?0:Math.min(1,k.klip||0));
  g.opPad=0; g.opPadH=0; g.opPadK=0; g.werk=0; g.bouer=null;
  spanne(g.x,g.y-8,16,'#8a6f3f'); klank(78,.32,.2);
  plToast('’n Muur het gebreek!');
  paSê(GT[g.tipe].hek?'Die hek is deur!':'Daar’s ’n gat in die muur!');
  MUUR.omringT=0; persistSoon();
}

/* ---------- BEWEGING ----------
   Harde stop met as-skeiding: 'n lyf wat 'n muur tref, gly langs hom af eerder
   as om te tril. Ons stoot terug na die vorige posisie op die as wat gebots het. */
function muurStoot(e,ox,oy,virMens){
  const g=muurPunt(e.x,e.y,virMens);
  if(!g)return null;
  if(!muurPunt(ox,e.y,virMens)){e.x=ox;return g;}
  if(!muurPunt(e.x,oy,virMens)){e.y=oy;return g;}
  if(!muurPunt(ox,oy,virMens)){e.x=ox;e.y=oy;return g;}
  /* Albei kante vas — hy staan IN die sel (bv. die muur is om hom gebou).
     Skuif hom by die naaste rand uit; nooit vasgevang nie. */
  const cx=selMidX(gxVan(e.x)), cy=selMidY(gyVan(e.y));
  const dx=e.x-cx, dy=e.y-cy;
  if(Math.abs(dx)>=Math.abs(dy))e.x=cx+(dx<0?-1:1)*(MUURGRID/2+8);
  else e.y=cy+(dy<0?-1:1)*(MUURGRID/2+8);
  return g;
}
function naasteHek(ax,ay,bx,by){
  let beste=null,bd=1e12;
  for(const g of MUUR.kaart.values()){
    if(!g.klaar||!GT[g.tipe].hek)continue;
    const d=Math.hypot(g.x-ax,g.y-ay)+Math.hypot(g.x-bx,g.y-by);
    if(d<bd){bd=d;beste=g;}
  }
  return beste;
}
/* Twee aanloop-punte: een aan die kant waar die stapper is, een aan die kant waar
   sy doel is. Die deurgang staan LOODREG op die muur se rigting. */
function hekPunte(p,ax,ay,bx,by){
  const hor=!!(muurBure(p)&(MUUR_O|MUUR_W));   // muur loop O-W -> stap N-S deur
  const d=30;
  let n,v;
  if(hor){
    const sn=(ay>p.y)?1:-1; let sv=(by>p.y)?1:-1;
    if(sv===sn)sv=-sn;                          // altyd deur, nooit om nie
    n=[p.x,p.y+sn*d]; v=[p.x,p.y+sv*d];
  }else{
    const sn=(ax>p.x)?1:-1; let sv=(bx>p.x)?1:-1;
    if(sv===sn)sv=-sn;
    n=[p.x+sn*d,p.y]; v=[p.x+sv*d,p.y];
  }
  return [n[0],n[1],v[0],v[1]];
}
/* Geen padvinding nie — 'n LYNTOETS plus een tussenpunt. Dit is genoeg omdat die
   enigste ondeurdringbare ding op die kaart 'n muur is, en 'n muur het altyd 'n
   hek (of anders klim hulle oor; sien onder). Ons toets hoogstens 2x per sekonde
   per mens, want die toets is die duurste ding in die stelsel. */
function muurOmpad(m,tx,ty,dt){
  if(!MUUR.kaart.size)return null;
  if(m.hekP){
    m.hekT-=dt;
    if(!m.hekP.klaar||m.hekT<=0)m.hekP=null;
    else{
      if(dist2(m.x,m.y,m.hekX,m.hekY)<22*22){
        if(m.hekF===0){m.hekF=1;m.hekX=m.hekQ[2];m.hekY=m.hekQ[3];}
        else m.hekP=null;
      }
      if(m.hekP)return [m.hekX,m.hekY];
    }
  }
  m.hekS=(m.hekS||0)-dt;
  if(m.hekS>0)return null;
  m.hekS=0.5+R()*0.3;
  /* Die doel self lê in 'n muur (iemand het bo-op 'n staanplek gebou). Nooit
     vasdraai nie: laat hom een keer oorklim. */
  if(muurPunt(tx,ty,true)){m.klim=Math.max(m.klim||0,4);return null;}
  if(!muurTussen(m.x,m.y,tx,ty,true))return null;
  const p=naasteHek(m.x,m.y,tx,ty);
  if(!p){
    /* GEEN HEK NIE. Ons weier om die simulasie te laat vashaak: hy klim oor.
       Die speler kry een keer te hore hoekom dit lelik lyk. */
    m.klim=Math.max(m.klim||0,8);
    if(!MUUR.klimSê){MUUR.klimSê=true;plToast('Hulle klim oor — bou ’n hekhuis.');
      paSê('Ons het ’n hek nodig, nie ’n kraal nie.');}
    return null;
  }
  m.hekQ=hekPunte(p,m.x,m.y,tx,ty);
  m.hekP=p; m.hekF=0; m.hekX=m.hekQ[0]; m.hekY=m.hekQ[1]; m.hekT=26;
  return [m.hekX,m.hekY];
}
/* Waar staan 'n draer om by 'n muur-bousite af te laai? Die standaardplek
   (site.y + h/2) val in die BUURSEL — as daardie buurman klaar is, kom die draer
   nooit binne 12px nie en die bres word nooit toegemaak nie. Kies 'n oop kant. */
function muurWerkPunt(g){
  const gx=gxVan(g.x), gy=gyVan(g.y);
  const kante=[[0,1],[-1,0],[1,0],[0,-1]];
  for(const [ox,oy] of kante){
    if(muurSolied(gx+ox,gy+oy,true))continue;
    return [g.x+ox*30+rand(-7,7), g.y+oy*30+rand(-7,7)];
  }
  return [g.x+rand(-8,8), g.y+8];
}
/* Die dwaler se antwoord op 'n muur: hy kap. 4 skade elke 1.1s ~ 3.6/s.
   Palissade (90) val in ~25s, klipmuur (240) in ~66s, hekhuis (300) in ~83s.
   Mure koop TYD; hulle is nie ewig nie. */
function dwalerMuur(d,ox,oy,dt){
  if(d.weg){d.kap=0;return;}
  const g=muurStoot(d,ox,oy,false);
  if(!g){d.kap=0;return;}
  d.kap=(d.kap||0)+dt;
  if(d.kap>=1.1){d.kap=0;muurSkade(g,4);}
}

/* ---------- PER-RAAM ---------- */
function mureTik(dt){
  if(MUUR.n!==GEB.length)muurIndeks();
  for(const g of MUUR.kaart.values()){
    const mx=muurHpMaks(g);
    if(g.hp===undefined)g.hp=g.klaar?mx:0;
    /* Voltooi (of herstel) -> vol gesondheid. Dit vang die eerste bou, die
       herbou ná 'n bres, én 'n ou stoorlêer sonder hp — sonder om mensTik aan
       te raak. */
    if(g.klaar&&!g.wasKlaar){g.hp=mx;g.wasKlaar=true;}
    if(!g.klaar)g.wasKlaar=false;
    if(g.skudT>0)g.skudT-=dt;
    if(GT[g.tipe].hek){
      let naby=false;
      for(const m of MENSE)if(dist2(m.x,m.y,g.x,g.y)<48*48){naby=true;break;}
      const doel=(g.klaar&&naby)?1:0, ou=g.hekOop||0;
      g.hekOop=ou+clamp(doel-ou,-dt*2.0,dt*2.0);
      if(ou<.03&&g.hekOop>=.03)klank(150,.14,.05);       // die hek kraak oop
    }
  }
  for(const m of MENSE)if(m.klim>0)m.klim-=dt;
  MUUR.omringT-=dt;
  if(MUUR.omringT<=0){MUUR.omringT=1.0;MUUR.omring=muurOmring();}
}

/* ---------- PLASING: SLEEP 'N LYN ---------- */
function muurSnapSpook(){
  SPOOK.x=selMidX(gxVan(SPOOK.x));
  SPOOK.y=selMidY(gyVan(SPOOK.y));
}
function muurLynSelle(){
  const ex=gxVan(SPOOK.x), ey=gyVan(SPOOK.y);
  if(!MUUR.begin||GT[PLAAS].enkel)return [[ex,ey]];
  const [bx,by]=MUUR.begin;
  const selle=[[bx,by]];
  let gx=bx, gy=by;
  const sx=ex>bx?1:ex<bx?-1:0, sy=ey>by?1:ey<by?-1:0;
  while(gx!==ex&&selle.length<MUUR_MAKS){gx+=sx;selle.push([gx,gy]);}
  while(gy!==ey&&selle.length<MUUR_MAKS){gy+=sy;selle.push([gx,gy]);}
  return selle;
}
function muurKlik(wx,wy){
  const gx=gxVan(wx), gy=gyVan(wy);
  SPOOK.x=selMidX(gx); SPOOK.y=selMidY(gy);
  if(GT[PLAAS].enkel){MUUR.begin=null;return;}
  if(!MUUR.begin||(MUUR.begin[0]===gx&&MUUR.begin[1]===gy)){
    MUUR.begin=[gx,gy];
    wysPrompt('Nou die ander punt — dan ✓ BOU.');
  }
  klank(430,.04,.06);
}
/* Word deur bevestigBou() eerste geroep. Gee true terug as ons dit hanteer het. */
function muurBevestig(){
  if(!PLAAS||!GT[PLAAS].muur)return false;
  const tipe=PLAAS, selle=muurLynSelle();
  let n=0;
  for(const [gx,gy] of selle){
    const x=selMidX(gx), y=selMidY(gy);
    if(MUUR.kaart.get(gsleutel(gx,gy)))continue;       // reeds 'n muur daar
    if(!kanBou(tipe,x,y))continue;
    GEB.push(nuweGebou(tipe,x,y)); n++;
  }
  if(!n){plToast('Kan nie daar bou nie.');return true;}
  muurIndeks();
  klank(420,.1,.12); S.g1=1;
  if(!S.eersteBou){S.eersteBou=1;paSê('Reg. Kom ons bou hom.');}
  plToast(n+' × '+GT[tipe].naam+' aangelê.');
  MUUR.begin=null;
  /* Die muur-gereedskap bly AAN — 'n mens bou 'n muur in hale, nie in een klik nie. */
  if(GT[tipe].enkel){PLAAS=null;wysPrompt(null);}
  else wysPrompt('Tik die volgende muur se begin, dan sy einde.');
  bouBalk(); persistSoon();
  return true;
}
/* Die spook vir 'n muurlyn: elke sel apart, met die vragte-telling by die punt. */
function muurSpook(){
  const G2=GT[PLAAS], selle=muurLynSelle();
  let vragte=0;
  for(const [gx,gy] of selle){
    const x=selMidX(gx), y=selMidY(gy);
    const besit=MUUR.kaart.get(gsleutel(gx,gy));
    const ok=!besit&&kanBou(PLAAS,x,y);
    if(ok)vragte+=stKoste(PLAAS);
    ctx.fillStyle=ok?'rgba(127,201,94,.22)':'rgba(192,80,56,.28)';
    ctx.fillRect(x-19,y-19,38,38);
    ctx.strokeStyle=ok?'#7fc95e':'#c05038';ctx.lineWidth=2.5;ctx.setLineDash([7,5]);
    ctx.strokeRect(x-19,y-19,38,38);ctx.setLineDash([]);
  }
  if(MUUR.begin){
    const [bx,by]=MUUR.begin;
    ctx.fillStyle='#e0b64f';
    ctx.fillRect(selMidX(bx)-5,selMidY(by)-5,10,10);
  }
  ctx.font='22px VT323,monospace';ctx.textAlign='center';
  ctx.fillStyle='#e0b64f';
  ctx.fillText(G2.ikoon+' '+selle.length+' · '+vragte+' vragte',SPOOK.x,SPOOK.y-28);
}

/* ---------- DIE VERWER ----------
   Die truuk: elke sel word 'n MIDDELBLOK plus 'n ARM na elke buurman. Ons teken
   ALLE voorvlakke, dan ALLE bo-vlakke. Omdat die paalhoogte presies twee keer die
   halwe dikte is, dek die bo-vlak van die suidelike sel altyd die voorvlak van
   die noordelike — 'n N-S loop lees as een deurlopende muur, en 'n hoek of T-stuk
   val vanself uit dieselfde reël uit. Geen tabel van 16 tekeninge nodig nie. */
function tekenMuur(g,f){
  const G2=GT[g.tipe], k=G2.mkleur;
  const b=muurBure(g);
  const skud=(g.skudT>0)?Math.sin(g.skudT*70)*2.2:0;
  const cx=g.x+skud, cy=g.y;
  const mx=muurHpMaks(g);
  const heel=g.klaar?clamp((g.hp===undefined?mx:g.hp)/mx,0,1):0;
  /* Hoogte volg SLEGS die bouvordering. Skade vreet nie hoogte nie — dit sou die
     bo-vlak se naatdekking breek en elke stukkende sel 'n donker streep gee. */
  const H=g.klaar?G2.hoog:Math.max(4,Math.round(G2.hoog*(0.28+f*0.72)));
  const T=G2.dik, HK=MUURGRID/2;
  const dele=[[cx-T,cy-T,T*2,T*2]];
  if(b&MUUR_N)dele.push([cx-T,cy-HK,T*2,HK-T]);
  if(b&MUUR_S)dele.push([cx-T,cy+T,T*2,HK-T]);
  if(b&MUUR_W)dele.push([cx-HK,cy-T,HK-T,T*2]);
  if(b&MUUR_O)dele.push([cx+T,cy-T,HK-T,T*2]);
  const reguit=(b===(MUUR_O|MUUR_W))||(b===(MUUR_N|MUUR_S));

  // grondskadu
  ctx.fillStyle='rgba(16,22,11,.30)';
  for(const [x,y,w,h] of dele)ctx.fillRect(x+5,y+5,w,h);
  // voorvlakke (donker) — dan bo-vlakke (lig), altyd in daardie volgorde
  ctx.fillStyle=k[1];
  for(const [x,y,w,h] of dele)ctx.fillRect(x,y+h-H,w,H);
  ctx.fillStyle=k[0];
  for(const [x,y,w,h] of dele)ctx.fillRect(x,y-H,w,h);

  /* 'n N-S loop word van die SYKANT gesien: sy bo-vlak is die muur se flank, nie
     sy loopvlak nie. Die tekstuur moet dus van orientasie verskil, anders lyk 'n
     vertikale muur soos 'n leer wat plat le. */
  const vert=!!(b&(MUUR_N|MUUR_S))&&!(b&(MUUR_O|MUUR_W));
  if(G2.klipMuur){
    ctx.strokeStyle='rgba(20,26,14,.34)';ctx.lineWidth=1.3;
    for(const [x,y,w,h] of dele){
      const y0=vert?y-H:y+h-H, y1=y+h;
      for(let ry=y0+7;ry<y1;ry+=7){ctx.beginPath();ctx.moveTo(x,ry);ctx.lineTo(x+w,ry);ctx.stroke();}
      let ri=0;
      for(let ry=y0;ry<y1;ry+=7){
        for(let px=x+((ri%2)?4:9);px<x+w;px+=10){
          ctx.beginPath();ctx.moveTo(px,ry);ctx.lineTo(px,Math.min(ry+7,y1));ctx.stroke();}
        ri++;
      }
    }
    ctx.fillStyle=k[2];                                    // kantele
    for(const [x,y,w,h] of dele){
      if(vert)for(let py=y-H;py<y-H+h-4;py+=9){ctx.fillRect(x-3,py,4,5);ctx.fillRect(x+w-1,py,4,5);}
      else for(let px=x;px<x+w-3;px+=9)ctx.fillRect(px,y-H-3,5,4);
    }
  }else{
    ctx.strokeStyle=k[2];ctx.lineWidth=1.6;                // pale
    for(const [x,y,w,h] of dele){
      const y0=vert?y-H:y+h-H;
      for(let px=x+3;px<x+w-1;px+=6){
        ctx.beginPath();ctx.moveTo(px,y0+1.5);ctx.lineTo(px,y+h-1);ctx.stroke();}
    }
    if(!vert){ctx.fillStyle=k[2];                          // paalkoppe op die loopvlak
      for(const [x,y,w] of dele)ctx.fillRect(x,y-H,w,3);}
  }
  ctx.strokeStyle='rgba(14,20,10,.72)';ctx.lineWidth=2;
  for(const [x,y,w,h] of dele)ctx.strokeRect(x,y+h-H,w,H);

  // hoek-, T- of endpaal: die stuk wat 'n muur soos 'n muur laat lees
  if(!reguit&&!G2.hek){
    const cb=T+2, ty=cy-cb-H-4;
    ctx.fillStyle=k[1];ctx.fillRect(cx-cb,cy+cb-H-4,cb*2,H+4);
    ctx.fillStyle=k[0];ctx.fillRect(cx-cb,ty,cb*2,cb*2);
    if(!G2.klipMuur){
      ctx.fillStyle=k[2];ctx.beginPath();
      ctx.moveTo(cx-cb,ty);ctx.lineTo(cx,ty-8);ctx.lineTo(cx+cb,ty);ctx.closePath();ctx.fill();
    }else{
      ctx.fillStyle=k[2];ctx.fillRect(cx-cb,ty-3,cb*2,4);
    }
    ctx.strokeStyle='rgba(14,20,10,.75)';ctx.lineWidth=2;
    ctx.strokeRect(cx-cb,ty,cb*2,cb*2);
    ctx.strokeRect(cx-cb,cy+cb-H-4,cb*2,H+4);
  }

  // ---- DIE HEKHUIS ----
  if(G2.hek){
    const hor=!!(b&(MUUR_O|MUUR_W))||!(b&(MUUR_N|MUUR_S));
    const oop=g.klaar?(g.hekOop||0):0;
    const torings=hor?[[cx-16,cy],[cx+16,cy]]:[[cx,cy-16],[cx,cy+16]];
    for(const [tx2,ty2] of torings){                       // noord eerste = agter
      ctx.fillStyle=k[1];ctx.fillRect(tx2-9,ty2+9-H-11,18,H+11);
      ctx.fillStyle=k[0];ctx.fillRect(tx2-9,ty2-9-H-11,18,18);
      ctx.strokeStyle='rgba(14,20,10,.78)';ctx.lineWidth=2;
      ctx.strokeRect(tx2-9,ty2-9-H-11,18,18);
      ctx.strokeRect(tx2-9,ty2+9-H-11,18,H+11);
      ctx.fillStyle=k[2];
      for(let px=tx2-9;px<tx2+8;px+=6)ctx.fillRect(px,ty2-9-H-14,4,4);
    }
    if(hor){                                   // deurgang N-S: die deur op die voorvlak
      const dw=18, dh=Math.max(8,Math.round(H*.74)), dy=cy+T-dh;
      ctx.fillStyle='#150f06';ctx.fillRect(cx-dw/2,dy,dw,dh);
      const bl=(dw/2)*(1-oop);
      if(bl>.6){
        ctx.fillStyle=k[2];
        ctx.fillRect(cx-dw/2,dy,bl,dh);ctx.fillRect(cx+dw/2-bl,dy,bl,dh);
        ctx.strokeStyle='rgba(14,20,10,.85)';ctx.lineWidth=1.6;
        ctx.strokeRect(cx-dw/2,dy,bl,dh);ctx.strokeRect(cx+dw/2-bl,dy,bl,dh);
      }
    }else{                                     // deurgang O-W: die gat lê op die bo-vlak
      const dw=Math.max(8,Math.round(T*1.5)), dh=20, dx0=cx-dw/2, dy0=cy-dh/2-H;
      ctx.fillStyle='#150f06';ctx.fillRect(dx0,dy0,dw,dh);
      const bl=(dh/2)*(1-oop);
      if(bl>.6){
        ctx.fillStyle=k[2];
        ctx.fillRect(dx0,dy0,dw,bl);ctx.fillRect(dx0,dy0+dh-bl,dw,bl);
        ctx.strokeStyle='rgba(14,20,10,.85)';ctx.lineWidth=1.6;
        ctx.strokeRect(dx0,dy0,dw,bl);ctx.strokeRect(dx0,dy0+dh-bl,dw,bl);
      }
    }
    if(g.klaar){                                           // die vlagpaal — 'n baken
      const py=cy-9-H-11;
      ctx.strokeStyle='#4e3c22';ctx.lineWidth=2.5;
      ctx.beginPath();ctx.moveTo(cx,py);ctx.lineTo(cx,py-22);ctx.stroke();
      const wap=Math.sin(performance.now()/240)*2.2;
      ctx.fillStyle='#e0b64f';ctx.beginPath();
      ctx.moveTo(cx,py-22);ctx.lineTo(cx+13,py-18+wap);ctx.lineTo(cx,py-13);
      ctx.closePath();ctx.fill();
    }
  }

  // ---- SKADE ----
  if(g.klaar&&heel<.999){
    const gapse=1+Math.round((1-heel)*4);
    ctx.fillStyle='rgba(14,18,9,.88)';
    for(let i=0;i<gapse;i++){
      const t=Rw(i*3.7+g.x*.011+g.y*.017);
      const px=cx-HK+4+t*(MUURGRID-12), ph=4+t*7;
      ctx.fillRect(px,cy-T-H,5,ph);
      ctx.fillRect(px+1,cy+T-H+2,3,4+ph*.6);
    }
    ctx.fillStyle='rgba(10,14,7,.72)';ctx.fillRect(cx-17,cy-H-19,34,6);
    ctx.fillStyle=heel>.5?'#7fc95e':heel>.25?'#e0b64f':'#c05038';
    ctx.fillRect(cx-16,cy-H-18,32*heel,4);
  }
  // ---- ONVOLTOOI: penne, materiaal, vorderingbalk (soos elke ander bousite) ----
  if(!g.klaar){
    ctx.strokeStyle='#c9b06a';ctx.lineWidth=1.6;ctx.setLineDash([5,5]);
    ctx.strokeRect(cx-HK+2,cy-HK+2,MUURGRID-4,MUURGRID-4);ctx.setLineDash([]);
    const oor=g.gelewer-g.verbruik;
    for(let i=0;i<Math.min(oor,3);i++){
      ctx.fillStyle='#8a6f3f';ctx.fillRect(cx-16+i*12,cy+HK-2,15,6);
      ctx.strokeStyle='#14180e';ctx.lineWidth=1.4;ctx.strokeRect(cx-16+i*12,cy+HK-2,15,6);
    }
    const p=(g.stadium+(g.gelewer>=stDrempel(g.tipe,g.stadium)?g.werk/2.0:0))/ST_N;
    ctx.fillStyle='rgba(10,14,7,.75)';ctx.fillRect(cx-HK,cy-HK-13,MUURGRID,7);
    ctx.fillStyle='#e0b64f';ctx.fillRect(cx-HK+1,cy-HK-12,(MUURGRID-2)*clamp(p,0,1),5);
  }
}

/* ---- MURE deur die REGISTERS (nie deur redigering van gelukFaktore/persist nie) ---- */
GLBRONNE.push(rye=>{
  /* +3 is doelbewus klein langs die braai se +4: 'n ring van 28 selle kos 56 vragte — 'n
     projek van dae — en die WERKLIKE beloning is dat dwalers buite bly, nie die syfer nie.
     Kategorie 'veiligheid' sodat dit binne daardie klem [-9,+4] meeding. */
  if(MUUR.omring)rye.push(['Die werf is omring',+3,'veiligheid']);
  else if(muurTal()>=6)rye.push(['’n Muur om agter te skuil',+1,'veiligheid']);
});
GEBVELDE.push((g,r)=>{if(GT[g.tipe].muur&&g.hp!==undefined)r.hp=Math.round(g.hp);});
GEBLAAI.push((g,o)=>{
  /* 'n Halfstukkende muur bly halfstukkend oor 'n herlaai — anders herstel 'n beleg
     homself terwyl die speler die bladsy verfris. Geen hp = "onbekend": mureTik vul dan
     vol gesondheid in. */
  if(o.hp!==undefined&&o.hp>=0){g.hp=o.hp;g.wasKlaar=!!o.k;}
});

function tekenMens(m){
  const wip=Math.sin(m.tred)*(m.dra?1.4:1.0);
  const x=m.x,y=m.y;
  if(SPAN.has(m)){
    /* Ring onder die voete PLUS 'n kepie bo die kop: by lae zoem is die ring
       vier pixels en 'n span in 'n gedrang moet steeds tel-baar wees. */
    ctx.strokeStyle='#e8c96a';ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(x,y+2,11,4.4,0,0,TAU);ctx.stroke();
    ctx.fillStyle='#e8c96a';ctx.fillRect(x-1.5,y-41,3,5);
  }

  ctx.fillStyle='rgba(10,14,7,.35)';
  ctx.beginPath();ctx.ellipse(x,y+2,8,3,0,0,TAU);ctx.fill();
  ctx.save();ctx.translate(x,y+wip*.4);
  if(m.rig<0)ctx.scale(-1,1);
  const tred=Math.sin(m.tred);
  ctx.fillStyle='#2a1f12';ctx.fillRect(-4+tred*2.5,-6,3.5,7);ctx.fillRect(1-tred*2.5,-6,3.5,7);
  ctx.fillStyle=m.klr;ctx.fillRect(-5,-19,10,13);
  ctx.fillStyle='rgba(226,240,180,.32)';ctx.fillRect(-5,-19,2.5,13);
  ctx.fillStyle='#dfa987';ctx.fillRect(-4,-27,8,8);
  ctx.fillStyle=m.hare;ctx.fillRect(-4,-29,8,3);
  const kap=m.taak&&(m.taak.tipe==='kap'||m.taak.tipe==='delf'&&m.taak.fase===1||
                     m.taak.tipe==='bou'||m.taak.tipe==='storm'&&m.taak.fase===1);
  if(kap&&!m.dra){
    const sw=Math.sin(m.slaan/0.9*Math.PI);
    ctx.save();ctx.translate(4,-16);ctx.rotate(-.6+sw*1.5);
    ctx.fillStyle='#5d4a2c';ctx.fillRect(0,-1.6,13,3.2);
    ctx.fillStyle='#9aa0a2';ctx.fillRect(11,-4.5,5,7);
    ctx.strokeStyle='#14180e';ctx.lineWidth=1.4;ctx.strokeRect(11,-4.5,5,7);
    ctx.restore();
  }else{ctx.fillStyle=m.klr;ctx.fillRect(-7,-17,3,8);ctx.fillRect(4,-17,3,8);}
  if(m.dra){
    const kl=m.dra==='hout'?'#8a6f3f':m.dra==='klip'?'#9aa0a2':((KOSSOORT[m.draS]||KOSSOORT.groente).kleur);
    ctx.fillStyle=kl;
    if(m.dra==='kos'){ctx.fillRect(-7,-34,14,9);}else ctx.fillRect(-8,-33,17,7);
    ctx.strokeStyle='#14180e';ctx.lineWidth=1.8;
    if(m.dra==='kos')ctx.strokeRect(-7,-34,14,9);else ctx.strokeRect(-8,-33,17,7);
  }
  ctx.strokeStyle='rgba(20,24,14,.75)';ctx.lineWidth=2;
  ctx.strokeRect(-5,-19,10,13);ctx.strokeRect(-4,-27,8,8);
  ctx.restore();
  if(m.sê>0){
    ctx.fillStyle='rgba(236,229,204,'+Math.min(1,m.sê)+')';
    ctx.font='15px VT323, monospace';ctx.textAlign='center';
    ctx.fillText('♪',x+8,y-34-(1.1-m.sê)*14);
  }
  if(KAM.z>1.5){
    ctx.font='13px VT323, monospace';ctx.textAlign='center';
    ctx.fillStyle='rgba(236,229,204,.75)';ctx.fillText(m.naam,x,y-36);
  }
}
function tekenBoom(b){
  if(b.toestand==='weg')return;
  const skud=b.skud>0?Math.sin(b.skud*60)*2:0;
  let hoek=0;
  if(b.toestand==='val'){const t=Math.min(1,b.valT/1.2);hoek=b.valHoek*(t*t)*(Math.PI/2*.92);}
  ctx.save();ctx.translate(b.x+skud,b.y);
  ctx.fillStyle='rgba(10,14,7,.3)';
  ctx.beginPath();ctx.ellipse(4,6,b.r*.9,b.r*.34,0,0,TAU);ctx.fill();
  ctx.rotate(hoek);
  ctx.fillStyle='#3a2a18';ctx.fillRect(-2.5,-8,5,14);
  const lae=[[0,-b.r*.9,b.r,'#2c4420'],[-b.r*.2,-b.r*1.1,b.r*.72,'#3d5c2a'],[-b.r*.34,-b.r*1.3,b.r*.42,'#4f7434']];
  for(const l of lae){ctx.fillStyle=l[3];ctx.beginPath();ctx.arc(l[0],l[1],l[2],0,TAU);ctx.fill();}
  ctx.strokeStyle='#1b2a12';ctx.lineWidth=2.4;
  ctx.beginPath();ctx.arc(0,-b.r*.9,b.r,0,TAU);ctx.stroke();
  if(b.gemerk){
    ctx.strokeStyle='#e0b64f';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(-7,-b.r*.9-7);ctx.lineTo(7,-b.r*.9+7);
    ctx.moveTo(7,-b.r*.9-7);ctx.lineTo(-7,-b.r*.9+7);ctx.stroke();
  }
  ctx.restore();
}
/* Een geparametriseerde gebou-verwer: dak met helling, muurvlak, kontoer, skadu —
   die geskeepte verf-taal. `f` is 0..1 bouvordering; onder 1 teken ons steiers. */
function tekenGebou(g){
  const G2=GT[g.tipe],r=gebRegs(g);
  const f=g.klaar?1:(g.stadium/ST_N);
  const x=r.x,y=r.y,w=r.w,h=r.h;
  /* Die seleksie-ring word EERSTE geverf sodat hy agter die gebou lê — 'n ring
     bo-oor sou die dak toesmeer. */
  if(GEKIES===g){
    /* DEEL DEUR KAM.z. Die doek is met ctx.scale(KAM.z,KAM.z) getransformeer, dus is
       ELKE maat hier in wereld-eenhede. 'n Foon begin by minZ 0.45 (kamBegin klem dit
       daarheen), waar 'n lynwydte van 2.4 as 1.08 CSS-pixels verf — die ring was dus
       op die teiken-toestel feitlik onsigbaar. 'n Koppelvlak-aanduiding moet 'n
       konstante SKERM-grootte he, nie 'n konstante wereld-grootte nie. */
    const z=Math.max(KAM.z,.05), r=7/z;
    ctx.strokeStyle='#e8c96a';ctx.lineWidth=2.4/z;ctx.setLineDash([7/z,5/z]);
    ctx.strokeRect(x-r,y-r,w+2*r,h+2*r);ctx.setLineDash([]);
  }
  if(G2.muur){tekenMuur(g,f);return;}   // mure teken hulself — hulle lees hul bure
  // werpskadu (groei saam met die dakrand, anders sweef die hoer vlakke)
  const sk=(gVlak(g)-1)*3;
  ctx.fillStyle='rgba(16,22,11,.28)';
  ctx.beginPath();ctx.moveTo(x+w*.16,y+h);ctx.lineTo(x+w+6+sk,y+h);
  ctx.lineTo(x+w+16+sk,y+h+10);ctx.lineTo(x+w*.16+12,y+h+10);ctx.closePath();ctx.fill();
  /* VLAK-PITTE: 'n opgradering wat jy nie kan SIEN nie, het nie gebeur nie.
     Ons verf hulle heel laaste in die funksie (sien vlakMerk hieronder) — maar die
     palissade keer vroeg terug, so dié een kry niks. */
  if(f<=0.01){                                  // net penne en tou
    ctx.strokeStyle='#c9b06a';ctx.lineWidth=1.8;ctx.setLineDash([5,5]);
    ctx.strokeRect(x,y,w,h);ctx.setLineDash([]);
    ctx.fillStyle='#5d4a2c';
    for(const [px,py] of [[x,y],[x+w,y],[x,y+h],[x+w,y+h]])ctx.fillRect(px-2,py-7,4,10);
    return;
  }
  const V=gVlak(g), saad=(g.x*0.031+g.y*0.017);
  const wh=Math.max(14,Math.round(h*.42)), ry=y+h-wh;
  const groei=VLAK_GEEN_DAKGROEI[g.tipe]?0:(V-1);   // die tuin se dak mag nie groei nie
  const dakOp=groei*7, eav=4+groei*3;               // hoër nok, wyer dakrand
  const yT=y-dakOp, rh=ry-yT;
  const kleure={skerm:['#9aa0a2','#7d8285','#8a7658'],huis:['#a24d3a','#7a3427','#c9c0aa'],
    houthut:['#7d5b45','#5b4133','#8a7658'],klipgroef:['#8c8477','#6d675c','#9aa0a2'],
    tuin:['#4f7434','#3d5c2a','#8a6f3f'],spens:['#b9a06a','#8a7648','#c9c0aa'],
    braai:['#a24d3a','#7a3427','#8a7658'],wagtoring:['#8a8a7a','#6b6a5a','#9aa0a2'],
    hoenderhok:['#b7743f','#8a5730','#c9c0aa'],visserhut:['#6f8b9c','#4e6675','#c9c0aa'],bakoond:['#a2564a','#7a3a30','#c9c0aa'],
    skathuis:['#b9a06a','#7a6a3f','#8c8477']}[g.tipe]
    ||['#8a7658','#6f5c44','#c9c0aa'];
  /* Beter materiaal: die muur word gekalk, die dak word dikker gedek. Een meng,
     geen tweede palet om uit pas te raak nie. */
  const muurKl=(V>=2)?mengKl(kleure[2],'#e2d8b8',V===2?.34:.55):kleure[2];
  const dakOn =(V>=2)?mengKl(kleure[1],'#2a1a12',V===2?.12:.22):kleure[1];
  const dakBo =(V>=2)?mengKl(kleure[0],'#2a1a12',V===2?.10:.18):kleure[0];
  // muurvlak (styg met f)
  const mh=wh*Math.min(1,f*1.6);
  ctx.fillStyle=muurKl;ctx.fillRect(x,y+h-mh,w,mh);
  ctx.fillStyle='rgba(16,22,11,.22)';ctx.fillRect(x+w-Math.min(11,w*.14),y+h-mh,Math.min(11,w*.14),mh);
  // hoekpale
  if(f<1){
    ctx.fillStyle='#6f5636';
    ctx.fillRect(x-2,y+h-wh-8,5,wh+10);ctx.fillRect(x+w-3,y+h-wh-8,5,wh+10);
  }
  const hip=Math.min(rh*.5,w*.2), yr=yT+rh*.46;
  if(f>=.6){    // dak
    ctx.fillStyle=dakOn;
    ctx.beginPath();ctx.moveTo(x-eav,ry);ctx.lineTo(x-eav,yT);ctx.lineTo(x+w+eav,yT);
    ctx.lineTo(x+w+eav,ry);ctx.closePath();ctx.fill();
    ctx.fillStyle=dakBo;
    ctx.beginPath();ctx.moveTo(x-eav,ry);ctx.lineTo(x+hip,yr);ctx.lineTo(x+w-hip,yr);
    ctx.lineTo(x+w+eav,ry);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(16,22,11,.18)';ctx.lineWidth=2;
    for(let i=1;i<Math.max(3,w/14);i++){const t2=i/Math.max(3,w/14);
      ctx.beginPath();ctx.moveTo(x-eav+(w+eav*2)*t2,yT);ctx.lineTo(x-eav+(w+eav*2)*t2,ry);ctx.stroke();}
    if(V>=2){   // dekriet-lae wat oormekaar lê: 'n dikker, beter dak
      ctx.strokeStyle='rgba(16,22,11,.26)';ctx.lineWidth=3;
      for(let i=1;i<=V;i++){const by=yT+rh*(i/(V+1));
        ctx.beginPath();ctx.moveTo(x-eav+1,by);ctx.lineTo(x+w+eav-1,by);ctx.stroke();}
    }
    ctx.strokeStyle='rgba(255,244,214,.3)';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(x+hip,yr);ctx.lineTo(x+w-hip,yr);ctx.stroke();
    if(V>=3){   // nokplank
      ctx.fillStyle='#5d4a2c';ctx.fillRect(x+hip-3,yr-4.5,w-hip*2+6,5);
      ctx.strokeStyle='rgba(14,20,10,.7)';ctx.lineWidth=2;
      ctx.strokeRect(x+hip-3,yr-4.5,w-hip*2+6,5);
    }
    ctx.fillStyle='rgba(16,22,11,.28)';ctx.fillRect(x,ry,w,5);
    ctx.strokeStyle='rgba(14,20,10,.72)';ctx.lineWidth=3;
    ctx.strokeRect(x-eav,yT,w+eav*2,rh);
    if(V>=2&&VLAK_SKOORSTEEN[g.tipe])            // 'n vuur binne kry 'n skoorsteen
      tekenSkoorsteen(x+w*(g.tipe==='huis'?.80:.72),yr+2,V>=3?13:11,(V>=3?30:22)+rh*.4,g.klaar,saad);
  }
  const fh=(V>=2?(V===2?7:10):0), bo=y+h-fh;     // vloerlyn bo-op die fondament
  if(g.klaar){
    ctx.fillStyle='#2b2015';                                  // deur
    ctx.fillRect(x+w*.62,bo-wh*.66,Math.min(15,w*.18),wh*.66);
    ctx.strokeStyle='rgba(14,20,10,.7)';ctx.lineWidth=2;
    ctx.strokeRect(x+w*.62,bo-wh*.66,Math.min(15,w*.18),wh*.66);
    if(G2.bed){                                               // vensters
      const nv=(V>=3&&w>=76)?3:2;
      for(let i=0;i<nv;i++){
        const vx=x+9+i*20;
        ctx.fillStyle='#23303c';ctx.fillRect(vx,bo-wh*.72,13,Math.max(6,wh*.34));
        ctx.fillStyle='#4d6a82';ctx.fillRect(vx+1.5,bo-wh*.72+1.5,10,Math.max(3,wh*.34-3));
        if(V>=2){                                             // luike by 'n beter huis
          ctx.strokeStyle='rgba(14,20,10,.7)';ctx.lineWidth=2;
          ctx.strokeRect(vx,bo-wh*.72,13,Math.max(6,wh*.34));
        }
      }
    }
  }
  ctx.strokeStyle='rgba(14,20,10,.72)';ctx.lineWidth=3;
  ctx.strokeRect(x,y+h-mh,w,mh);
  if(f>.02)tekenFondament(x,y,w,h,V,saad);       // die klipfondament kom eerste op
  // die tuin kry rye; die braai 'n vuur; die toring 'n lantern
  if(g.klaar&&g.tipe==='tuin'){
    const rye=(V===1?4:V===2?6:8);               // meer rye = 'n groter land
    ctx.strokeStyle='#3a2c1a';ctx.lineWidth=4;
    for(let i=0;i<rye;i++){const ly=y+12+i*((h-20)/(rye-1));
      ctx.beginPath();ctx.moveTo(x+6,ly);ctx.lineTo(x+w-6,ly);ctx.stroke();}
    ctx.fillStyle='#7fc95e';
    const pR=(V===1?2:V===2?3:4), pK=(V===1?8:V===2?9:10);
    for(let i=0;i<pR*pK;i++)
      ctx.fillRect(x+8+(i%pK)*((w-16)/pK),y+10+((i/pK)|0)*((h-18)/pR),4,6);
  }
  if(g.klaar&&g.tipe==='braai'&&BRAAI_AAN){
    const vs=1+(V-1)*.34;                        // 'n beter braai brand groter
    const fl=Math.sin(performance.now()/90)*2;
    ctx.fillStyle='#e0632a';ctx.beginPath();
    ctx.moveTo(g.x-8*vs,g.y-6);ctx.lineTo(g.x+fl,g.y-26*vs);ctx.lineTo(g.x+8*vs,g.y-6);ctx.closePath();ctx.fill();
    ctx.fillStyle='#ffe0a0';ctx.beginPath();
    ctx.moveTo(g.x-4*vs,g.y-6);ctx.lineTo(g.x+fl*.6,g.y-17*vs);ctx.lineTo(g.x+4*vs,g.y-6);ctx.closePath();ctx.fill();
  }
  if(V>=2&&f>=.6)tekenVlakEkstras(g,V,x,y,w,h,wh,bo,yT,ry,yr,hip,kleure);
  /* Die vlak-merk heel bo: vlak 2 'n goue gewelpen, vlak 3 'n wapperende banier.
     Nooit albei nie — een merk per gebou, anders lees dit as ruis. */
  if(f>=.6&&g.tipe!=='tuin'){
    if(V===2&&g.tipe!=='wagtoring')tekenGewelpen(x+hip+3,yr-1);
    else if(V>=3){
      // waar die skoorsteen staan, skuif die banier na die ander nokpunt
      const bx=(g.tipe==='wagtoring')?x+w*.5+10:(VLAK_SKOORSTEEN[g.tipe]?x+hip+3:x+w-hip-19);
      const by=(g.tipe==='wagtoring')?yT-34-16:yr-2;
      tekenBanier(bx,by,'#c05038',saad);
    }
  }
  if(g.klaar&&g.tipe==='skathuis'){
    /* Die kis groei sigbaar met die skat. Dis die enigste plek op die kaart waar
       goud lê — munte lê nêrens, want munte hoort nie aan die plaas nie. */
    const bx=x+w*.15, by=y+h-wh*.46;
    ctx.fillStyle='#5d4a2c';ctx.fillRect(bx,by,22,13);
    ctx.fillStyle='#3c2f1b';ctx.fillRect(bx,by,22,4);
    const n=Math.min(6,Math.ceil((S.goud||0)/12));
    ctx.fillStyle='#e0b64f';
    for(let i=0;i<n;i++)ctx.fillRect(bx+3+(i%3)*6,by-3-((i/3)|0)*3,5,3);
    ctx.strokeStyle='#14180e';ctx.lineWidth=1.5;ctx.strokeRect(bx,by,22,13);
  }
  if(g.klaar&&g.tipe==='hoenderhok'){            // 'n paar hoenders in die hok
    for(let i=0;i<4;i++){
      const hx=x+11+((i*17)%Math.max(10,w-26)), hy=y+h-wh-7-((i%2)*5);
      ctx.fillStyle='#e8e2d0';ctx.fillRect(hx,hy,5,5);
      ctx.fillStyle='#c05038';ctx.fillRect(hx+1,hy-2,3,2);
    }
  }
  if(g.klaar&&g.tipe==='bakoond'){               // skoorsteen; rook terwyl hy bak
    ctx.fillStyle='#6d675c';ctx.fillRect(x+w-18,y-12,9,16);
    ctx.strokeStyle='#14180e';ctx.lineWidth=1.6;ctx.strokeRect(x+w-18,y-12,9,16);
    if(g.rook>T){
      const t2=performance.now()/260;
      for(let i=0;i<3;i++){
        ctx.fillStyle='rgba(220,214,196,'+(0.30-i*0.08)+')';
        ctx.beginPath();ctx.arc(x+w-13+Math.sin(t2+i)*4,y-16-i*11,4+i*2,0,TAU);ctx.fill();
      }
    }
  }
  if(g.klaar&&g.tipe==='visserhut'){             // nette wat droog hang
    ctx.strokeStyle='#9aa07f';ctx.lineWidth=1.4;
    for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(x+9+i*6,y+h-wh-2);
      ctx.lineTo(x+9+i*6,y+h-wh+12);ctx.stroke();}
    ctx.beginPath();ctx.moveTo(x+9,y+h-wh+5);ctx.lineTo(x+27,y+h-wh+5);ctx.stroke();
  }
  // materiaal wat by die site lê
  if(!g.klaar){
    const oor=g.gelewer-g.verbruik;
    for(let i=0;i<Math.min(oor,6);i++){
      ctx.fillStyle='#8a6f3f';ctx.fillRect(x-4+i*11,y+h+4,17,7);
      ctx.strokeStyle='#14180e';ctx.lineWidth=1.5;ctx.strokeRect(x-4+i*11,y+h+4,17,7);
    }
    // vorderingbalk
    const p=(g.stadium+ (g.gelewer>=sDrempel(g,g.stadium)?g.werk/2.0:0))/ST_N;
    const yT2=y-(VLAK_GEEN_DAKGROEI[g.tipe]?0:(gVlak(g)-1))*7;   // bo die (hoer) dak
    ctx.fillStyle='rgba(10,14,7,.75)';ctx.fillRect(x,yT2-13,w,7);
    /* 'n Opgradering kry 'n GOUE balk sodat dit nie soos 'n nuwe bousite lyk nie —
       die speler moet kan sien sy gebou word aangebou, nie vervang nie. */
    ctx.fillStyle=g.opgradeer?'#e8c96a':'#e0b64f';
    ctx.fillRect(x+1,yT2-12,(w-2)*clamp(p,0,1),5);
  }
  /* Die vlak word nou in die SILHOEET gedra (gewelpen/banier/fondament/skoorsteen) —
     die ou goue pitte is weg: een merk per gebou, anders lees dit as ruis. */
}

const VLAK_N=3;
/* gVlak() bestaan reeds (klem op VLAKKE[t].length) — die agent se weergawe is weggelaat. */
/* Die tuin is 'n LAND en die palissade 'n heining: hulle dak mag nie groei nie. */
const VLAK_GEEN_DAKGROEI={tuin:1,palissade:1};
/* Waar 'n vuur binne brand kom 'n skoorsteen met rook by op vlak 2. */
const VLAK_SKOORSTEEN={huis:1,spens:1,braai:1};
/* Watter kant toe 'n werkplek se aanbousel groei (-1 links, +1 regs). */
const VLAK_UITBOU={houthut:-1,klipgroef:1,spens:-1};

/* Hex-meng: 'beter materiaal' sonder om 'n tweede palet te moet onderhou. */
function mengKl(a,b,t){
  const pa=parseInt(a.slice(1),16), pb=parseInt(b.slice(1),16);
  const r=Math.round((pa>>16&255)+((pb>>16&255)-(pa>>16&255))*t);
  const gg=Math.round((pa>>8&255)+((pb>>8&255)-(pa>>8&255))*t);
  const bb=Math.round((pa&255)+((pb&255)-(pa&255))*t);
  return '#'+((1<<24)|(r<<16)|(gg<<8)|bb).toString(16).slice(1);
}

/* Klipfondament: die duidelikste "dit is opgegradeer"-teken by uitgezoomde
   kamera, want dit verander die gebou se onderste rand se KLEUR oor sy hele wydte. */
function tekenFondament(x,y,w,h,V,saad){
  if(V<2)return 0;
  const ph=(V===2?7:10);
  ctx.fillStyle='#8c8477';ctx.fillRect(x-3,y+h-ph,w+6,ph);
  ctx.fillStyle='#75705f';
  const n=Math.max(3,Math.round(w/14)), bw=(w+6)/n;
  for(let i=0;i<n;i++){
    const bx=x-3+i*bw;
    if((i+(saad|0))%2===0)ctx.fillRect(bx+1.5,y+h-ph+1.5,bw-3,ph*.38);
    else ctx.fillRect(bx+1.5,y+h-ph*.48,bw-3,ph*.34);
  }
  ctx.fillStyle='rgba(255,244,214,.20)';ctx.fillRect(x-3,y+h-ph,w+6,2);
  ctx.strokeStyle='rgba(14,20,10,.72)';ctx.lineWidth=2.4;
  ctx.strokeRect(x-3,y+h-ph,w+6,ph);
  return ph;
}

/* Skoorsteen + drie rookpofies: bewys dat daar binne gekook word. */
function tekenSkoorsteen(px,onder,bw,bh,rook,saad){
  ctx.fillStyle='#8c8477';ctx.fillRect(px-bw/2,onder-bh,bw,bh);
  ctx.fillStyle='#75705f';
  for(let i=0;i<3;i++)ctx.fillRect(px-bw/2+1.5+(i%2)*2.5,onder-bh+4+i*5,bw-5,3);
  ctx.fillStyle='#a09585';ctx.fillRect(px-bw/2-3,onder-bh-5,bw+6,5);
  ctx.strokeStyle='rgba(14,20,10,.72)';ctx.lineWidth=2.4;
  ctx.strokeRect(px-bw/2,onder-bh,bw,bh);
  ctx.strokeRect(px-bw/2-3,onder-bh-5,bw+6,5);
  if(!rook)return;
  const t=performance.now()/1000;
  for(let i=0;i<3;i++){
    const p=(t*.4+i/3+saad*.13)%1;
    ctx.fillStyle='rgba(226,220,200,'+(0.34*(1-p)).toFixed(3)+')';
    ctx.beginPath();ctx.arc(px+Math.sin(p*3.4+i)*5,onder-bh-10-p*28,3+p*7,0,TAU);ctx.fill();
  }
}

/* Aanbousel teen die sy: die werkplek het uitgebrei en jy sien dit van ver af.
   Dit steek BUITE die voetstuk uit — net verf, geen botsing. */
function tekenUitbouing(x,y,w,h,wh,V,kleure,kant){
  const uw=Math.round(w*(V>=3?.34:.23)), uh=Math.round(wh*.80);
  const ux=(kant<0)? x-uw+3 : x+w-3, uy=y+h-uh;
  ctx.fillStyle=kleure[2];ctx.fillRect(ux,uy,uw,uh);
  ctx.fillStyle='rgba(16,22,11,.24)';ctx.fillRect(ux,uy,uw,uh*.26);
  const bi=(kant<0)?x+3:x+w-3, bu=(kant<0)?ux-5:ux+uw+5;   // dak hel na buite af
  ctx.fillStyle=kleure[1];
  ctx.beginPath();ctx.moveTo(bi,uy-13);ctx.lineTo(bu,uy+2);
  ctx.lineTo(bu,uy+9);ctx.lineTo(bi,uy-6);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(14,20,10,.72)';ctx.lineWidth=2.4;
  ctx.strokeRect(ux,uy,uw,uh);
  ctx.beginPath();ctx.moveTo(bi,uy-13);ctx.lineTo(bu,uy+2);
  ctx.lineTo(bu,uy+9);ctx.lineTo(bi,uy-6);ctx.closePath();ctx.stroke();
}

/* Die banier van vlak 3: die enigste ding wat bo die dak uitsteek en wapper,
   dus die een merk wat jy nog uitmaak as die kamera heeltemal uitgezoem is. */
function tekenBanier(px,py,kl,saad){
  const t=performance.now()/380+saad;
  ctx.strokeStyle='#4a3a22';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(px,py+3);ctx.lineTo(px,py-24);ctx.stroke();
  const w1=Math.sin(t)*2.2, w2=Math.sin(t+1.1)*2.4;
  ctx.beginPath();ctx.moveTo(px+1.5,py-23);ctx.lineTo(px+18+w1,py-20+w2);
  ctx.lineTo(px+18+w1,py-12+w2);ctx.lineTo(px+1.5,py-8);ctx.closePath();
  ctx.fillStyle=kl;ctx.fill();
  ctx.strokeStyle='rgba(14,20,10,.72)';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='rgba(255,244,214,.30)';ctx.fillRect(px+1.5,py-23,3.5,15);
  ctx.fillStyle='#e0b64f';ctx.beginPath();ctx.arc(px,py-25.5,2.8,0,TAU);ctx.fill();
}

/* Vlak 2 se stil merk: een goue gewelpen op die nok. Vlak 3 vervang hom met
   die banier — die twee mag nooit saam verskyn nie, anders lees dit as ruis. */
function tekenGewelpen(px,py){
  ctx.fillStyle='#e0b64f';
  ctx.beginPath();ctx.moveTo(px,py-10);ctx.lineTo(px+5,py-5);
  ctx.lineTo(px,py);ctx.lineTo(px-5,py-5);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(14,20,10,.72)';ctx.lineWidth=1.8;ctx.stroke();
}

/* Per-tipe vlak-ekstras. Word NA die kern-verf geroep sodat alles bo-op lê.
   bo = die vloerlyn (bokant van die fondament), yT = dakpunt, ry = dakrand. */
function tekenVlakEkstras(g,V,x,y,w,h,wh,bo,yT,ry,yr,hip,kleure){
  const saad=(g.x*0.031+g.y*0.017);
  // die werkplek se aanbousel kom eerste: alles anders lê bo-op hom
  if(VLAK_UITBOU[g.tipe])tekenUitbouing(x,y,w,h,wh,V,kleure,VLAK_UITBOU[g.tipe]);
  switch(g.tipe){
  case 'skerm':
    if(V>=2){                       // afdak op twee pale: die kamp het skaduwee
      ctx.strokeStyle='#6f5636';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(x-13,bo);ctx.lineTo(x-13,ry+4);
      ctx.moveTo(x+w+13,bo);ctx.lineTo(x+w+13,ry+4);ctx.stroke();
      ctx.fillStyle=mengKl(kleure[0],'#d8cdae',.35);
      ctx.beginPath();ctx.moveTo(x-15,ry+2);ctx.lineTo(x+w+15,ry+2);
      ctx.lineTo(x+w+11,ry+9);ctx.lineTo(x-11,ry+9);ctx.closePath();ctx.fill();
      ctx.strokeStyle='rgba(14,20,10,.72)';ctx.lineWidth=2.2;ctx.stroke();
    }
    if(V>=3){                       // 'n tweede tentjie: die kamp het gegroei
      ctx.fillStyle=kleure[1];
      ctx.beginPath();ctx.moveTo(x-24,bo);ctx.lineTo(x-11,bo-24);
      ctx.lineTo(x+2,bo);ctx.closePath();ctx.fill();
      ctx.fillStyle=kleure[0];
      ctx.beginPath();ctx.moveTo(x-11,bo-24);ctx.lineTo(x+2,bo);
      ctx.lineTo(x-4,bo);ctx.closePath();ctx.fill();
      ctx.strokeStyle='rgba(14,20,10,.72)';ctx.lineWidth=2.4;
      ctx.beginPath();ctx.moveTo(x-24,bo);ctx.lineTo(x-11,bo-24);
      ctx.lineTo(x+2,bo);ctx.closePath();ctx.stroke();
    }
    break;
  case 'huis':
    if(V>=2){                       // stoep: twee pale en 'n plank onder die dakrand
      ctx.fillStyle='#6f5636';
      ctx.fillRect(x+w*.50,ry+2,4,bo-ry-2);ctx.fillRect(x+w-8,ry+2,4,bo-ry-2);
      ctx.fillStyle='#8a7658';ctx.fillRect(x+w*.46,bo-3,w*.52,4);
      ctx.strokeStyle='rgba(14,20,10,.62)';ctx.lineWidth=2;
      ctx.strokeRect(x+w*.46,bo-3,w*.52,4);
    }
    if(V>=3){                       // dakvenster: die solder is uitgebou
      const dx=x+w*.55, dy=yT+(ry-yT)*.42;
      ctx.fillStyle=kleure[1];
      ctx.beginPath();ctx.moveTo(dx-11,dy+12);ctx.lineTo(dx,dy-6);
      ctx.lineTo(dx+11,dy+12);ctx.closePath();ctx.fill();
      ctx.fillStyle='#23303c';ctx.fillRect(dx-5,dy+2,10,10);
      ctx.fillStyle='#4d6a82';ctx.fillRect(dx-3.5,dy+3.5,7,7);
      ctx.strokeStyle='rgba(14,20,10,.72)';ctx.lineWidth=2.2;
      ctx.beginPath();ctx.moveTo(dx-11,dy+12);ctx.lineTo(dx,dy-6);
      ctx.lineTo(dx+11,dy+12);ctx.closePath();ctx.stroke();
    }
    break;
  case 'houthut':
    if(V>=2){                       // die houtstapel teen die muur — sigbare voorraad
      const ry2=(V>=3?3:2);
      for(let r2=0;r2<ry2;r2++)for(let i=0;i<3;i++){
        ctx.fillStyle=(i%2)?'#93764a':'#8a6f3f';
        ctx.fillRect(x+w-26+i*9,bo-8-r2*8,8,7);
        ctx.strokeStyle='#14180e';ctx.lineWidth=1.5;
        ctx.strokeRect(x+w-26+i*9,bo-8-r2*8,8,7);
      }
    }
    if(V>=3){                       // saagbok: die hut saag nou self planke
      ctx.strokeStyle='#6f5636';ctx.lineWidth=3.2;
      ctx.beginPath();
      ctx.moveTo(x+6,bo);ctx.lineTo(x+15,bo-13);ctx.moveTo(x+24,bo);ctx.lineTo(x+15,bo-13);
      ctx.moveTo(x+4,bo-13);ctx.lineTo(x+26,bo-13);ctx.stroke();
    }
    break;
  case 'klipgroef':
    if(V>=2){                       // gekapte blokke, netjies gestapel
      for(let i=0;i<(V>=3?5:3);i++){
        ctx.fillStyle=(i%2)?'#8c8477':'#9aa0a2';
        ctx.fillRect(x+4+(i%3)*13,bo-9-((i/3)|0)*9,12,8);
        ctx.strokeStyle='#14180e';ctx.lineWidth=1.6;
        ctx.strokeRect(x+4+(i%3)*13,bo-9-((i/3)|0)*9,12,8);
      }
    }
    if(V>=3){                       // hysbalk met tou en klip: die groef het 'n katrol
      ctx.fillStyle='#6f5636';ctx.fillRect(x+w-6,yr+4,30,5);
      ctx.strokeStyle='rgba(14,20,10,.72)';ctx.lineWidth=2;

/* VLAK-PITTE — klein goue stippels op die dak se lyn. Leesbaar by lae zoem omdat
   dit vorm-inligting is (tel die pitte), nie teks nie. Vlak 1 kry niks: 'n merker
   op ALLES is geen merker nie. */
function vlakMerk(g,x,y,w,h){
  const v=gVlak(g);
  if(v<2||!g.klaar)return;
  const n=v-1;
  const z=Math.max(KAM.z,.05);                 // sien die ring hierbo: konstante SKERM-grootte
  for(let i=0;i<n;i++){
    const px=x+w/2+(i-(n-1)/2)*9/z, py=y-6/z;
    ctx.fillStyle='#e8c96a';ctx.beginPath();ctx.arc(px,py,3.4/z,0,TAU);ctx.fill();
    ctx.strokeStyle='#14180e';ctx.lineWidth=1.4/z;ctx.stroke();
  }
}
function tekenHoop(soort){
  const h=HOOP[soort];const n=Math.min(voorraad(soort),15);
  if(!vis(h.x,h.y,80))return;
  const kl=soort==='hout'?['#8a6f3f','#93764a']:soort==='klip'?['#8c8477','#75705f']:['#6ea84c','#7fc95e'];
  const kosKl=soort==='kos'?kosBlokKleure(15):null;     // die hoop wys sy soorte as bande
  for(let i=0;i<n;i++){
    const ry=Math.floor(i/5),rx=i%5;
    ctx.fillStyle=kosKl?kosKl[i]:kl[ry%2];
    ctx.fillRect(h.x-24+rx*10+(ry%2)*5,h.y-4-ry*7,18,7);
    ctx.strokeStyle='#14180e';ctx.lineWidth=1.5;
    ctx.strokeRect(h.x-24+rx*10+(ry%2)*5,h.y-4-ry*7,18,7);
  }
  if(voorraad(soort)>15){
    ctx.fillStyle='#ece5cc';ctx.font='15px VT323,monospace';ctx.textAlign='center';
    ctx.fillText(voorraad(soort),h.x,h.y-30);
  }
}
let laas=performance.now();
/* VERWERS-REGISTER. Vyf kenmerke (neste, gevegte, kaserne, helde, held-vermoens) het elk
   gese "voeg t===6 by" — en die laaste `else` was PA, nie 'n verstek nie. Twee daarvan
   geintegreer en 'n zombie word as 'n held geverf. Nou vra 'n kenmerk sy eie nommer:
     const T_NES=verwerId(tekenNes);   ...   dinge.push([y,T_NES,nes]);
   en niemand redigeer die lus ooit weer nie. */
function tekenHoender(d){
  ctx.fillStyle='rgba(10,14,7,.3)';ctx.beginPath();ctx.ellipse(d.x,d.y+1,4,1.6,0,0,TAU);ctx.fill();
  ctx.fillStyle='#ece5cc';ctx.beginPath();ctx.ellipse(d.x,d.y-4,4.4,3.6,0,0,TAU);ctx.fill();
  ctx.fillStyle='#c05038';ctx.fillRect(d.x+((d.vx>=0)?2:-3.4),d.y-8.5,1.6,1.8);
  const pik=Math.sin(d.pik)>0.6?2:0;
  ctx.fillStyle='#e0b64f';ctx.fillRect(d.x+((d.vx>=0)?3.4:-4.8),d.y-6+pik,1.6,1.2);
  ctx.strokeStyle='rgba(20,24,14,.6)';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.ellipse(d.x,d.y-4,4.4,3.6,0,0,TAU);ctx.stroke();
}
function tekenDwaler(d){
  const wip=Math.sin(d.tred)*1.6;

  ctx.fillStyle='#2b3a22';ctx.fillRect(-4,-6,3.5,7);ctx.fillRect(1,-6,3.5,7);
  const zk=d.eie?(d.vlak>=3?'#7a3a24':'#6a4f2c'):'#4e6b34';   // 'n nes-zombie lyk anders as 'n dwaler
  ctx.fillStyle=zk;ctx.fillRect(-5,-18,10,12);
  ctx.fillStyle='rgba(226,240,180,.3)';ctx.fillRect(-5,-18,2.5,12);
  ctx.fillStyle='#93a86c';ctx.fillRect(-4,-26,8,8);
  ctx.fillStyle='#c04030';ctx.fillRect(-2.5,-23,2,2);ctx.fillRect(1,-23,2,2);
  ctx.fillStyle=zk;ctx.fillRect(-9,-15+wip,4,3);ctx.fillRect(5,-15-wip,4,3);
  ctx.strokeStyle='#14180e';ctx.lineWidth=2;

function tekenPa(){
  ctx.save();ctx.translate(PA.x,PA.y);
